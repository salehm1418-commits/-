
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c14">

<title>لقطة AI | حل الأسئلة بالكاميرا</title>
<meta name="description" content="صوّر السؤال واحصل على الإجابة واحفظ أسئلتك السابقة.">
<meta property="og:title" content="لقطة AI">
<meta property="og:description" content="حل الأسئلة بالكاميرا مع سجل للصور والإجابات.">
<meta property="og:image" content="https://salehm1418-commits.github.io/-/logo.png">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<style>
:root{
  color-scheme:dark;
  --bg:#080c14;
  --panel:#111c30;
  --line:#28364c;
  --blue:#2563eb;
  --green:#059669;
  --muted:#a6b5ca;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer;color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}

header{
  position:sticky;
  top:0;
  z-index:30;
  background:#0d1525f7;
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;
  box-shadow:0 8px 25px #0005;
}
.headline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.identity{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.identity img{
  width:54px;
  height:54px;
  object-fit:contain;
  border-radius:14px;
  border:1px solid #284a65;
}
.identity h1{
  font-size:21px;
  margin:0;
  font-weight:850;
}
.identity p{
  font-size:11px;
  color:var(--muted);
  margin:3px 0 0;
}
.top-actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}
.top-btn{
  min-height:49px;
  border:1px solid #375477;
  border-radius:12px;
  background:#172b48;
  font-size:15px;
  font-weight:800;
  padding:0 11px;
}
.key-btn{
  font-size:24px;
  min-width:48px;
}
.modes{
  display:flex;
  gap:9px;
  margin-top:12px;
}
.mode{
  flex:1;
  min-height:49px;
  border:1px solid #34445d;
  background:#1b293e;
  border-radius:12px;
  font-weight:800;
  font-size:17px;
}
.mode.active{
  background:var(--blue);
  border-color:#4f8cff;
}
.numbers{
  display:none;
  gap:7px;
  margin-top:10px;
  align-items:center;
}
.numbers.visible{display:flex}
.numbers span{
  font-size:12px;
  color:var(--muted);
}
.number{
  flex:1;
  min-height:42px;
  border-radius:10px;
  border:1px solid #34445d;
  background:#1b293e;
  font-size:16px;
  font-weight:800;
}
.number.active{
  background:var(--blue);
  border-color:#4f8cff;
}

main{
  max-width:680px;
  margin:auto;
  padding:12px 12px 30px;
}
.camera{
  position:relative;
  height:62dvh;
  min-height:300px;
  background:#000;
  border:1px solid #334155;
  border-radius:18px;
  overflow:hidden;
}
video,#photo{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}
#photo{display:none}
.camera-note{
  position:absolute;
  bottom:12px;
  left:12px;
  right:12px;
  text-align:center;
  background:#081222c9;
  padding:9px;
  border-radius:10px;
  color:#d5e4f5;
  font-size:13px;
  pointer-events:none;
}
#capture{
  display:block;
  width:100%;
  margin-top:12px;
  padding:18px 8px;
  border:0;
  border-radius:14px;
  background:var(--blue);
  font-size:20px;
  font-weight:800;
}
#capture.new{background:var(--green)}

.result{
  margin-top:13px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--panel);
  padding:16px;
  display:none;
}
.status{
  font-size:14px;
  color:#7dd3fc;
  font-weight:700;
}
.answer{
  font-size:25px;
  line-height:1.55;
  font-weight:800;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin-top:8px;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:70;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:#000c;
}
.overlay.open{display:flex}
.modal{
  background:#101b2e;
  border:1px solid #40516b;
  border-radius:18px;
  width:min(100%,480px);
  max-height:88dvh;
  overflow:auto;
  padding:18px;
}
.modal h2{margin:0 0 10px}
.modal p{
  font-size:13px;
  line-height:1.7;
  color:var(--muted);
}
.field{margin-top:12px}
.field label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
}
.field input,.search-input{
  width:100%;
  background:#070f1d;
  color:white;
  border:1px solid #3b4b64;
  border-radius:10px;
  padding:12px;
}
.field input{direction:ltr}
.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}
.modal-actions button,.action-btn{
  flex:1;
  border:0;
  border-radius:11px;
  background:var(--blue);
  padding:12px;
  font-weight:800;
}
.modal-actions .secondary,.secondary{
  background:#334155;
}
.danger{background:#991b1b!important}

.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.history-head h2{margin:0}
.history-count{
  color:var(--muted);
  font-size:13px;
}
.search-input{
  margin:14px 0;
  font-size:16px;
}
.history-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.history-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px;
  border:1px solid #34445d;
  border-radius:13px;
  background:#172238;
}
.history-thumb{
  width:76px;
  height:85px;
  object-fit:contain;
  background:#000;
  border-radius:9px;
  flex-shrink:0;
}
.history-info{
  flex:1;
  min-width:0;
}
.history-answer{
  font-weight:800;
  font-size:15px;
  overflow-wrap:anywhere;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.history-date{
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
}
.history-buttons{
  display:flex;
  gap:7px;
  margin-top:9px;
}
.history-buttons button{
  border:0;
  background:#2563eb;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}
.history-buttons .delete{
  background:#7f1d1d;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
  line-height:1.8;
}
.detail-image{
  width:100%;
  max-height:45dvh;
  object-fit:contain;
  background:#000;
  border-radius:12px;
  margin-top:12px;
}
.detail-answer{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:22px;
  font-weight:800;
  line-height:1.6;
  margin-top:12px;
}
.detail-date{
  color:var(--muted);
  font-size:12px;
}
@media(max-width:390px){
  .identity img{width:45px;height:45px}
  .identity h1{font-size:18px}
  .identity p{font-size:10px}
  .top-btn{padding:0 8px;font-size:13px}
  .key-btn{min-width:42px;font-size:22px}
  .mode{font-size:15px}
}
</style>
</head>

<body>

<header>
  <div class="headline">
    <div class="identity">
      <img src="logo.png" alt="شعار لقطة AI">
      <div>
        <h1>لقطة AI</h1>
        <p>صوّر السؤال وشاهد الإجابة</p>
      </div>
    </div>

    <div class="top-actions">
      <button class="top-btn" onclick="openHistory()">📚 السجل</button>
      <button class="top-btn key-btn" onclick="openSettings()" aria-label="إدارة المفاتيح">🔑</button>
    </div>
  </div>

  <div class="modes">
    <button id="auto" class="mode" onclick="setMode('auto')">⚡ أوتو</button>
    <button id="manual" class="mode" onclick="setMode('manual')">✋ يدوي</button>
  </div>

  <div id="numbers" class="numbers">
    <span>المفتاح</span>
    <button class="number" data-n="0" onclick="chooseKey(0)">1</button>
    <button class="number" data-n="1" onclick="chooseKey(1)">2</button>
    <button class="number" data-n="2" onclick="chooseKey(2)">3</button>
    <button class="number" data-n="3" onclick="chooseKey(3)">4</button>
    <button class="number" data-n="4" onclick="chooseKey(4)">5</button>
  </div>
</header>

<main>
  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="السؤال الملتقط">
    <div id="cameraNote" class="camera-note">جاري تشغيل الكاميرا...</div>
  </div>

  <button id="capture" onclick="mainAction()">📸 التقاط وتحليل فوري</button>

  <section id="result" class="result" aria-live="polite">
    <div id="status" class="status"></div>
    <div id="answer" class="answer"></div>
  </section>
</main>

<!-- إعدادات المفاتيح -->
<div id="settingsOverlay" class="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="مفاتيح Gemini">
    <h2>🔑 مفاتيح Gemini</h2>
    <p>أضف مفاتيحك الخاصة. الخانات من 1 إلى 5 مستقلة وتُحفظ على هذا المتصفح.</p>
    <div id="inputs"></div>
    <div class="modal-actions">
      <button onclick="saveSettings()">حفظ</button>
      <button class="secondary" onclick="closeSettings()">إلغاء</button>
    </div>
  </div>
</div>

<!-- سجل البحث -->
<div id="historyOverlay" class="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="سجل الأسئلة">
    <div class="history-head">
      <h2>📚 سجل البحث</h2>
      <span id="historyCount" class="history-count"></span>
    </div>

    <p>أسئلتك السابقة مع صورها وإجاباتها محفوظة على هذا الجهاز.</p>

    <input
      id="historySearch"
      class="search-input"
      type="search"
      placeholder="🔎 ابحث في الإجابات السابقة..."
      oninput="renderHistory()"
    >

    <div id="historyList" class="history-list"></div>

    <div class="modal-actions">
      <button class="danger" onclick="clearHistory()">🗑️ مسح السجل</button>
      <button class="secondary" onclick="closeHistory()">إغلاق</button>
    </div>
  </div>
</div>

<!-- عرض سؤال قديم -->
<div id="detailOverlay" class="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="السؤال السابق">
    <h2>📖 السؤال السابق</h2>
    <div id="detailDate" class="detail-date"></div>
    <img id="detailImage" class="detail-image" alt="صورة السؤال">
    <div id="detailAnswer" class="detail-answer"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeDetail()">رجوع للسجل</button>
    </div>
  </div>
</div>

<script>
'use strict';

const MODEL = 'gemini-3.8-flash';
const $ = id => document.getElementById(id);

const video = $('video');
const photo = $('photo');
const captureBtn = $('capture');
const note = $('cameraNote');
const result = $('result');
const statusEl = $('status');
const answerEl = $('answer');

let keys = Array(5).fill('');
let selected = 0;
let mode = localStorage.getItem('gemini_mode') === 'manual' ? 'manual' : 'auto';
let captured = false;
let controller = null;
let requestId = 0;
let cameraStream = null;
let currentImage = null;

/* قاعدة بيانات السجل */
const DB_NAME = 'LaqtaAIHistory';
const STORE_NAME = 'questions';
let dbPromise = null;
let historyCache = [];

function openDatabase() {
  if (!('indexedDB' in window)) {
    return Promise.reject(new Error('هذا المتصفح لا يدعم حفظ السجل.'));
  }

  if (dbPromise) return dbPromise;

  dbPromise = new Promise((resolve,reject) => {
    const request = indexedDB.open(DB_NAME,1);

    request.onupgradeneeded = () => {
      const db = request.result;

      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME,{
          keyPath:'id',
          autoIncrement:true
        });
        store.createIndex('createdAt','createdAt');
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  }).catch(e => {
    dbPromise = null;
    throw e;
  });

  return dbPromise;
}

async function saveHistory(image,answer) {
  const db = await openDatabase();

  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE_NAME,'readwrite');
    const store = tx.objectStore(STORE_NAME);

    store.add({
      image,
      answer,
      createdAt:Date.now()
    });

    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function getHistory() {
  const db = await openDatabase();

  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE_NAME,'readonly');
    const request = tx.objectStore(STORE_NAME).getAll();

    request.onsuccess = () => {
      const items = request.result || [];
      items.sort((a,b) => b.createdAt-a.createdAt);
      resolve(items);
    };

    request.onerror = () => reject(request.error);
  });
}

async function deleteHistoryItem(id) {
  const db = await openDatabase();

  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function deleteAllHistory() {
  const db = await openDatabase();

  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function formatDate(timestamp) {
  return new Date(timestamp).toLocaleString('ar-SA',{
    year:'numeric',
    month:'short',
    day:'numeric',
    hour:'numeric',
    minute:'2-digit'
  });
}

async function openHistory() {
  $('historyOverlay').classList.add('open');
  $('historySearch').value = '';
  $('historyList').textContent = 'جاري تحميل السجل...';

  try {
    historyCache = await getHistory();

    if ($('historyOverlay').classList.contains('open')) {
      renderHistory();
    }
  } catch(e) {
    $('historyList').textContent =
      'تعذر فتح السجل: ' + e.message;
  }
}

function closeHistory() {
  $('historyOverlay').classList.remove('open');
}

function renderHistory() {
  const list = $('historyList');
  const search = $('historySearch').value.trim().toLowerCase();

  list.replaceChildren();

  $('historyCount').textContent = historyCache.length + ' سؤال';

  const filtered = historyCache.filter(item =>
    item.answer.toLowerCase().includes(search) ||
    formatDate(item.createdAt).includes(search)
  );

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = search
      ? 'ما لقينا نتيجة مطابقة للبحث.'
      : 'السجل فارغ حالياً. صوّر أول سؤال وبتظهر إجابته هنا تلقائياً.';
    list.append(empty);
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'history-item';

    const img = document.createElement('img');
    img.className = 'history-thumb';
    img.src = item.image;
    img.alt = 'صورة السؤال السابق';
    img.loading = 'lazy';

    const info = document.createElement('div');
    info.className = 'history-info';

    const answer = document.createElement('div');
    answer.className = 'history-answer';
    answer.textContent = item.answer;

    const date = document.createElement('div');
    date.className = 'history-date';
    date.textContent = formatDate(item.createdAt);

    const actions = document.createElement('div');
    actions.className = 'history-buttons';

    const openBtn = document.createElement('button');
    openBtn.textContent = '👁️ عرض';
    openBtn.onclick = () => showHistoryDetail(item.id);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete';
    deleteBtn.textContent = '🗑️ حذف';
    deleteBtn.onclick = () => removeHistoryItem(item.id);

    actions.append(openBtn,deleteBtn);
    info.append(answer,date,actions);
    card.append(img,info);
    list.append(card);
  });
}

function showHistoryDetail(id) {
  const item = historyCache.find(x => x.id === id);
  if (!item) return;

  $('detailImage').src = item.image;
  $('detailAnswer').textContent = item.answer;
  $('detailDate').textContent = formatDate(item.createdAt);
  $('detailOverlay').classList.add('open');
}

function closeDetail() {
  $('detailOverlay').classList.remove('open');
  $('detailImage').removeAttribute('src');
}

async function removeHistoryItem(id) {
  if (!confirm('تبي تحذف هذا السؤال من السجل؟')) return;

  try {
    await deleteHistoryItem(id);
    historyCache = historyCache.filter(item => item.id !== id);
    renderHistory();
  } catch(e) {
    alert('تعذر حذف السؤال: '+e.message);
  }
}

async function clearHistory() {
  if (!historyCache.length) return;

  if (!confirm('متأكد تبي تمسح جميع الأسئلة والصور والإجابات؟ ما تقدر تسترجعها.')) {
    return;
  }

  try {
    await deleteAllHistory();
    historyCache = [];
    renderHistory();
  } catch(e) {
    alert('تعذر مسح السجل: '+e.message);
  }
}

/* الإعدادات */
function load() {
  try {
    const savedKeys = JSON.parse(localStorage.getItem('gemini_keys') || '[]');

    if (Array.isArray(savedKeys)) {
      savedKeys.slice(0,5).forEach((v,i) => {
        keys[i] = typeof v === 'string' ? v.trim() : '';
      });
    }
  } catch(e) {}

  if (!keys.some(Boolean)) {
    const old = localStorage.getItem('gemini_key');
    if (old) keys[0] = old.trim();
  }

  const saved = Number(localStorage.getItem('selected_gemini_key') || 0);

  selected = Number.isInteger(saved) && saved >= 0 && saved < 5
    ? saved
    : 0;

  if (!keys[selected]) {
    const first = keys.findIndex(Boolean);
    if (first >= 0) selected = first;
  }

  render();
  startCamera();

  if (!keys.some(Boolean)) {
    show('مرحباً بك في لقطة AI','اضغط 🔑 وأضف مفتاح Gemini الخاص بك للبدء.');
  }
}

function show(status,text) {
  result.style.display = 'block';
  statusEl.textContent = status;
  answerEl.textContent = text || '';
}

function stopRequest() {
  requestId++;

  if (controller) {
    controller.abort();
    controller = null;
  }
}

function render() {
  $('auto').classList.toggle('active',mode === 'auto');
  $('manual').classList.toggle('active',mode === 'manual');
  $('numbers').classList.toggle('visible',mode === 'manual');

  document.querySelectorAll('.number').forEach(b => {
    const n = Number(b.dataset.n);

    b.disabled = !keys[n];
    b.classList.toggle('active',n === selected && !!keys[n]);
    b.title = keys[n]
      ? 'المفتاح '+(n+1)
      : 'لا يوجد مفتاح محفوظ';
  });
}

function setMode(value) {
  if (mode === value) return;

  stopRequest();
  mode = value;
  localStorage.setItem('gemini_mode',mode);
  render();

  if (captured) {
    show('تم تغيير الوضع','التقط سؤالاً جديداً للمتابعة.');
  }
}

function chooseKey(n) {
  if (!keys[n]) return;

  stopRequest();
  selected = n;
  localStorage.setItem('selected_gemini_key',String(n));
  render();

  if (captured) {
    show('المفتاح رقم '+(n+1)+' محدد','التقط سؤالاً جديداً للمتابعة.');
  }
}

function openSettings() {
  const inputs = $('inputs');
  inputs.replaceChildren();

  for (let i=0;i<5;i++) {
    const wrap = document.createElement('div');
    wrap.className = 'field';

    const label = document.createElement('label');
    label.textContent = 'المفتاح رقم '+(i+1);
    label.htmlFor = 'key'+i;

    const input = document.createElement('input');
    input.id = 'key'+i;
    input.type = 'password';
    input.autocomplete = 'off';
    input.placeholder = 'AIza...';
    input.value = keys[i];

    wrap.append(label,input);
    inputs.append(wrap);
  }

  $('settingsOverlay').classList.add('open');
}

function closeSettings() {
  $('settingsOverlay').classList.remove('open');
}

function saveSettings() {
  stopRequest();

  keys = Array.from({length:5},(_,i) => $('key'+i).value.trim());

  localStorage.setItem('gemini_keys',JSON.stringify(keys));
  localStorage.removeItem('gemini_key');

  if (!keys[selected]) {
    const first = keys.findIndex(Boolean);
    selected = first < 0 ? 0 : first;
  }

  localStorage.setItem('selected_gemini_key',String(selected));

  closeSettings();
  render();

  show(
    'تم حفظ المفاتيح',
    keys.some(Boolean)
      ? 'وجّه الكاميرا للسؤال واضغط التقاط.'
      : 'أضف مفتاحاً واحداً على الأقل للبدء.'
  );
}

['settingsOverlay','historyOverlay','detailOverlay'].forEach(id => {
  $(id).addEventListener('click',e => {
    if (e.target !== $(id)) return;

    if (id === 'settingsOverlay') closeSettings();
    if (id === 'historyOverlay') closeHistory();
    if (id === 'detailOverlay') closeDetail();
  });
});

/* الكاميرا الخلفية العادية 1x قدر الإمكان */
async function startCamera() {
  let stream;

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('افتح الموقع عبر HTTPS وفي متصفح يدعم الكاميرا');
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:'environment'}
      }
    });

    try {
      const devices = (await navigator.mediaDevices.enumerateDevices())
        .filter(d => d.kind === 'videoinput');

      const rear = devices.filter(d =>
        /back|rear|environment|خلف/i.test(d.label)
      );

      const ordinary =
        rear.find(d => /^(back|rear) camera$/i.test(d.label.trim())) ||
        rear.find(d =>
          /wide/i.test(d.label) &&
          !/ultra|dual|triple|tele|macro/i.test(d.label)
        ) ||
        rear.find(d =>
          !/ultra|tele|dual|triple|macro|0\.5|2x|3x|5x/i.test(d.label)
        );

      if (
        ordinary &&
        ordinary.deviceId &&
        stream.getVideoTracks()[0]?.getSettings().deviceId !== ordinary.deviceId
      ) {
        try {
          const preferred = await navigator.mediaDevices.getUserMedia({
            audio:false,
            video:{
              deviceId:{exact:ordinary.deviceId}
            }
          });

          stream.getTracks().forEach(t => t.stop());
          stream = preferred;

        } catch(e) {}
      }
    } catch(e) {}

    const track = stream.getVideoTracks()[0];

    try {
      const caps = track.getCapabilities?.();

      if (caps?.zoom && typeof track.applyConstraints === 'function') {
        const target = Math.max(
          caps.zoom.min,
          Math.min(1,caps.zoom.max)
        );

        await track.applyConstraints({
          advanced:[{zoom:target}]
        });
      }
    } catch(e) {}

    cameraStream = stream;
    video.srcObject = stream;
    await video.play();

    note.textContent = 'وجّه الكاميرا نحو السؤال';

  } catch(e) {
    if (stream) stream.getTracks().forEach(t => t.stop());

    note.textContent = 'الكاميرا لم تعمل — تحقق من إذن الكاميرا';

    show(
      'تعذر تشغيل الكاميرا',
      e.name === 'NotAllowedError'
        ? 'اسمح للموقع باستخدام الكاميرا من إعدادات المتصفح.'
        : e.message
    );
  }
}

/* التصوير */
function mainAction() {
  if (captured) {
    reset();
    return;
  }

  if (!video.videoWidth) {
    show('الكاميرا غير جاهزة','تأكد من السماح للكاميرا ثم حدّث الصفحة.');
    return;
  }

  stopRequest();

  const canvas = document.createElement('canvas');
  const s = Math.min(
    1,
    1280/Math.max(video.videoWidth,video.videoHeight)
  );

  canvas.width = Math.round(video.videoWidth*s);
  canvas.height = Math.round(video.videoHeight*s);

  canvas.getContext('2d').drawImage(
    video,0,0,canvas.width,canvas.height
  );

  const image = canvas.toDataURL('image/jpeg',.75);
  currentImage = image;

  photo.src = image;
  photo.style.display = 'block';
  video.style.display = 'none';
  note.style.display = 'none';

  captured = true;
  captureBtn.classList.add('new');
  captureBtn.textContent = '🔄 التقاط سؤال جديد';

  analyze(image);
}

function reset() {
  stopRequest();

  captured = false;
  currentImage = null;

  photo.style.display = 'none';
  photo.removeAttribute('src');
  video.style.display = 'block';
  note.style.display = 'block';
  note.textContent = 'وجّه الكاميرا نحو السؤال';

  captureBtn.classList.remove('new');
  captureBtn.textContent = '📸 التقاط وتحليل فوري';

  result.style.display = 'none';
}

/* Gemini */
function isKeyError(e) {
  return e.status === 401 || (
    e.status === 403 &&
    /api.key|invalid.key|key.not.valid|api_key/i.test(e.message) &&
    !/quota|rate.limit|safety/i.test(e.message)
  );
}

function errorText(e) {
  if (e.status === 429) {
    return 'انتهت حصة الاستخدام أو وصلت إلى حد الطلبات. انتظر أو راجع حدود مشروعك.';
  }
  if (e.status === 400 || e.status === 404) {
    return 'النموذج المحدد غير متاح أو الطلب غير مقبول. راجع اسم النموذج وإعدادات Gemini API.';
  }
  if (e.status === 401 || e.status === 403) {
    return 'مفتاح API غير صالح أو ليس لديه الصلاحية المطلوبة.';
  }
  if ([500,502,503,504].includes(e.status)) {
    return 'خدمة Gemini مشغولة مؤقتاً. حاول بعد قليل.';
  }
  if (e instanceof TypeError) {
    return 'تعذر الاتصال بالخدمة. تحقق من الإنترنت.';
  }

  return e.message || 'حدث خطأ غير معروف.';
}

async function ask(key,image,signal) {
  const url =
    'https://generativelanguage.googleapis.com/v1beta/models/' +
    encodeURIComponent(MODEL) +
    ':generateContent?key=' +
    encodeURIComponent(key);

  const response = await fetch(url,{
    method:'POST',
    signal,
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{
        parts:[
          {
            text:'اقرأ السؤال والخيارات في الصورة. أعط حرف الخيار الصحيح ونص الإجابة فقط دون شرح. إذا لم تستطع قراءة السؤال فقل إن الصورة غير واضحة ولا تخمّن.'
          },
          {
            inline_data:{
              mime_type:'image/jpeg',
              data:image.split(',')[1]
            }
          }
        ]
      }],
      generationConfig:{
        temperature:0,
        maxOutputTokens:256
      }
    })
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const e = new Error(data.error?.message || 'HTTP '+response.status);
    e.status = response.status;
    throw e;
  }

  const candidate = data.candidates?.[0];

  const text = candidate?.content?.parts
    ?.filter(x => typeof x.text === 'string')
    .map(x => x.text)
    .join('\n');

  if (!text?.trim()) {
    if (
      candidate?.finishReason === 'SAFETY' ||
      data.promptFeedback?.blockReason
    ) {
      throw new Error('لم يتمكن النموذج من الإجابة عن هذا الطلب.');
    }

    throw new Error('لم تصل إجابة نصية. حاول بصورة أوضح.');
  }

  return text.replace(/\*\*/g,'').trim();
}

async function analyze(image) {
  if (!keys.some(Boolean)) {
    show('لا يوجد مفتاح','اضغط 🔑 وأضف مفتاح Gemini الخاص بك.');
    return;
  }

  if (!keys[selected]) {
    show('اختر مفتاحاً','اختر مفتاحاً محفوظاً أو أضفه من 🔑.');
    return;
  }

  stopRequest();

  const id = requestId;
  controller = new AbortController();
  const signal = controller.signal;

  const order = mode === 'manual'
    ? [selected]
    : [
        selected,
        ...keys.map((_,i) => i).filter(i => i !== selected && keys[i])
      ];

  try {
    for (const index of order) {
      show('جاري التحليل بالمفتاح '+(index+1)+'...','');

      let last;

      for (let attempt=0;attempt<2;attempt++) {
        try {
          const text = await ask(keys[index],image,signal);

          if (id !== requestId) return;

          selected = index;
          localStorage.setItem('selected_gemini_key',String(index));
          render();

          show('تم التحليل — المفتاح '+(index+1),text);

          /* حفظ صورة السؤال والإجابة تلقائياً */
          try {
            await saveHistory(image,text);

            if (id === requestId) {
              statusEl.textContent =
                'تم التحليل والحفظ في السجل — المفتاح '+(index+1);
            }
          } catch(saveError) {
            if (id === requestId) {
              statusEl.textContent =
                'تم التحليل — تعذر حفظ السجل';
            }
            console.error('History save error:',saveError);
          }

          return;

        } catch(e) {
          if (id !== requestId || signal.aborted) return;

          last = e;

          if (
            (e instanceof TypeError ||
            [500,502,503,504].includes(e.status)) &&
            attempt === 0
          ) {
            await new Promise((resolve,reject) => {
              const t = setTimeout(resolve,1000);

              signal.addEventListener('abort',() => {
                clearTimeout(t);
                reject(new DOMException('Aborted','AbortError'));
              },{once:true});
            });

            continue;
          }

          break;
        }
      }

      if (mode === 'auto' && isKeyError(last)) {
        continue;
      }

      throw last;
    }

    throw new Error('لم يتوفر مفتاح صالح للاستخدام.');

  } catch(e) {
    if (id !== requestId || e.name === 'AbortError') return;
    show('تعذر تحليل السؤال',errorText(e));
  } finally {
    if (id === requestId) controller = null;
  }
}
