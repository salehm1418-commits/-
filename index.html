
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>لقطة AI</title>
<link rel="icon" href="logo.png">

<style>
:root{
  color-scheme:dark;
  --bg:#0b1220;
  --card:#121f35;
  --card2:#1c2c45;
  --line:#33445e;
  --text:#f5f7fb;
  --muted:#a8b5c9;
  --blue:#2563eb;
  --green:#059669;
}
body.light{
  color-scheme:light;
  --bg:#f3f6fb;
  --card:#fff;
  --card2:#e9eef7;
  --line:#cbd5e1;
  --text:#152239;
  --muted:#59677b;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button{
  cursor:pointer;
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
}
button:disabled{opacity:.5;cursor:not-allowed}
button.active,.primary{
  background:var(--blue);
  color:#fff;
  border-color:#4e86ff;
}
.success{
  background:var(--green);
  color:white;
  border-color:var(--green);
}
.danger{
  background:#7f1d1d;
  color:white;
  border-color:#991b1b;
}
.wrap{
  max-width:820px;
  margin:auto;
  padding:14px 12px 40px;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
}
.brand h1{font-size:23px;margin:0}
.brand small{color:var(--muted);font-size:12px}
.tools{display:flex;gap:7px}
.tools button{padding:9px}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:12px;
  margin:12px 0;
}
.modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.modes button{
  min-height:58px;
  font-size:19px;
  font-weight:800;
  border-radius:16px;
}
.modes button.active{
  background:linear-gradient(135deg,#2563eb,#3478f6);
  border-color:#6a9bff;
  box-shadow:0 3px 12px #2563eb25;
}
.providers{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:12px;
}
.providers button{
  font-size:12px;
  font-weight:700;
  padding:13px 4px;
}
.keyChoices{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.keyChoices button{
  flex:1 1 90px;
  font-size:13px;
  padding:11px 5px;
}
.hint{
  color:var(--muted);
  font-size:13px;
  margin:10px 2px 0;
}
.camera{
  background:#000;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  height:62dvh;
  min-height:290px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.camera video,.camera img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.camera .empty{
  text-align:center;
  color:#b9c6d9;
  padding:24px;
}
.capture{
  width:100%;
  font-size:22px;
  font-weight:800;
  padding:20px;
  margin-top:12px;
}
.answerPanel{
  text-align:center;
  padding:18px 12px 22px;
}
.status{
  color:#49b9ff;
  font-size:14px;
  font-weight:700;
  margin-bottom:12px;
  overflow-wrap:anywhere;
}
.answer{
  font-size:clamp(29px,7vw,46px);
  font-weight:900;
  line-height:1.65;
  text-align:center;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:12px 4px;
}
.answer.choice{font-size:clamp(34px,8vw,52px)}
.answer.loading{
  font-size:23px;
  color:var(--muted);
}
.answer.error{
  font-size:17px;
  font-weight:500;
  text-align:right;
}
.hidden{display:none!important}
.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.row>*{flex:1}
.row button{white-space:normal}
.modal{
  position:fixed;
  inset:0;
  z-index:30;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}
.dialog{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  width:min(720px,100%);
  max-height:90dvh;
  overflow:auto;
  padding:17px;
}
.dialog h2{margin:0 0 12px;font-size:22px}
.section{
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin:14px 0;
}
.field{margin:13px 0}
.field label{
  display:block;
  margin-bottom:7px;
}
.field input,.keyInput{
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  direction:ltr;
  text-align:left;
}
.fixed{
  background:var(--card2);
  border-radius:12px;
  padding:13px;
  direction:ltr;
  text-align:left;
  overflow-wrap:anywhere;
}
.small{color:var(--muted);font-size:13px}
.accordion{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:right;
  background:transparent;
  border:none;
  padding:7px 0;
  font-size:19px;
  font-weight:800;
}
.accordion .arrow{
  font-size:20px;
  transition:transform .2s;
}
.accordion.open .arrow{
  transform:rotate(180deg);
}
.keyItem{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin:10px 0;
  background:var(--bg);
}
.keyItemHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.keyItemHead button{
  color:#fca5a5;
  padding:6px 10px;
  font-size:13px;
}
.mainKeyBadge{
  font-size:12px;
  color:#86efac;
  border:1px solid #166534;
  background:#14532d55;
  border-radius:10px;
  padding:6px 9px;
}
.addKey{
  width:100%;
  border:1px dashed #6a9bff;
  background:var(--card2);
  color:var(--text);
  font-weight:800;
  padding:15px;
  margin-top:8px;
}
.search{
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
}
.listitem{
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px;
  margin:10px 0;
}
.listitem img{
  width:100%;
  max-height:145px;
  object-fit:contain;
  background:#000;
  border-radius:10px;
}
.listitem p{
  font-size:20px;
  font-weight:800;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.detailImage{
  width:100%;
  max-height:45dvh;
  object-fit:contain;
  background:#000;
  border-radius:14px;
}
.archiveAnswer{
  font-size:clamp(24px,5vw,36px);
  font-weight:800;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  text-align:center;
  padding:16px 4px;
}
@media(max-width:440px){
  .brand h1{font-size:20px}
  .brand img{width:44px;height:44px}
  .tools button{padding:8px}
  .dialog{padding:13px}
}
</style>
</head>

<body>

<div class="wrap">
<header>
  <div class="brand">
    <img src="logo.png" alt="لقطة AI"
      onerror="this.style.display='none'">
    <div>
      <h1>لقطة AI</h1>
      <small>صوّر السؤال وشاهد الإجابة</small>
    </div>
  </div>

  <div class="tools">
    <button id="themeBtn" aria-label="تغيير المظهر">☀️</button>
    <button id="historyBtn">📚 السجل</button>
    <button id="settingsBtn" aria-label="الإعدادات">🔑</button>
  </div>
</header>

<div class="panel">
  <div class="modes">
    <button id="autoBtn" class="active">تلقائي</button>
    <button id="manualBtn">يدوي</button>
  </div>

  <div id="manualBox" class="hidden">
    <div class="providers">
      <button data-provider="gemini">🔵 Gemini</button>
      <button data-provider="openrouter">🟣 OpenRouter</button>
      <button data-provider="openai">🟢 OpenAI</button>
    </div>

    <div id="keyChoices" class="keyChoices"></div>
    <p id="providerHint" class="hint"></p>
  </div>

  <p id="modeHint" class="hint"></p>
</div>

<div class="camera">
  <video id="video" autoplay playsinline muted></video>
  <img id="preview" class="hidden" alt="السؤال الملتقط">

  <div id="cameraEmpty" class="empty hidden">
    <h2>📷 الكاميرا غير متاحة</h2>
    <p>اسمح للموقع باستخدام الكاميرا.</p>
    <button id="retryCamera">إعادة المحاولة</button>
  </div>
</div>

<button id="captureBtn" class="capture primary">
  📸 التقاط السؤال وتحليله
</button>

<div class="panel answerPanel">
  <div id="answerStatus" class="status">
    وجّه الكاميرا نحو السؤال
  </div>
  <div id="answer" class="answer loading">
    الإجابة بتظهر هنا
  </div>
</div>
</div>

<!-- الإعدادات -->
<div id="settingsModal" class="modal hidden">
  <div class="dialog">
    <div class="row">
      <h2>🔑 إعدادات المفاتيح</h2>
      <button data-close="settingsModal">✕ إغلاق</button>
    </div>

    <p class="small">
      كل شركة لها مفتاح أول أساسي لا ينحذف.
      وتقدر تضيف مفاتيح أخرى وتحذفها.
    </p>

    <div id="providerSettings"></div>

    <div class="row">
      <button data-close="settingsModal">إلغاء</button>
      <button id="saveSettings" class="primary">💾 حفظ الكل</button>
    </div>
  </div>
</div>

<!-- الأرشيف -->
<div id="historyModal" class="modal hidden">
  <div class="dialog">
    <div class="row">
      <h2>📚 أرشيف الأسئلة</h2>
      <button data-close="historyModal">✕ إغلاق</button>
    </div>

    <input id="historySearch" class="search"
      placeholder="ابحث في الإجابات أو التاريخ...">

    <div class="row" style="margin-top:10px">
      <button id="clearHistory" class="danger">
        🗑️ حذف السجل كاملًا
      </button>
      <button id="refreshHistory">🔄 تحديث</button>
    </div>

    <div id="historyList"></div>
  </div>
</div>

<!-- تفاصيل الأرشيف -->
<div id="detailModal" class="modal hidden">
  <div class="dialog">
    <div class="row">
      <h2>📖 السؤال المحفوظ</h2>
      <button data-close="detailModal">✕ إغلاق</button>
    </div>

    <img id="detailImage" class="detailImage"
      alt="صورة السؤال">

    <p id="detailDate" class="small"></p>
    <div id="detailAnswer" class="archiveAnswer"></div>

    <div class="row">
      <button id="copyArchive">📋 نسخ الإجابة</button>
      <button id="shareArchive">📤 مشاركة الإجابة</button>
    </div>

    <div class="row" style="margin-top:9px">
      <button id="saveOriginal">⬇️ حفظ صورة السؤال</button>
      <button id="shareOriginal">📤 مشاركة السؤال</button>
    </div>

    <div class="row" style="margin-top:9px">
      <button id="saveCombined" class="success">
        🖼️ حفظ السؤال والإجابة بصورة
      </button>
      <button id="shareCombined">
        📤 مشاركة الصورة والإجابة
      </button>
    </div>
  </div>
</div>

<script>
'use strict';

const GEMINI_MODEL='gemini-3.8-flash';

const PROVIDERS=[
  {
    id:'gemini',
    name:'Gemini',
    icon:'🔵',
    defaultModel:GEMINI_MODEL
  },
  {
    id:'openrouter',
    name:'OpenRouter',
    icon:'🟣',
    defaultModel:'google/gemini-2.5-flash'
  },
  {
    id:'openai',
    name:'OpenAI',
    icon:'🟢',
    defaultModel:'gpt-4.1-mini'
  }
];

const $=id=>document.getElementById(id);

function getJSON(key,fallback){
  try{
    return JSON.parse(localStorage.getItem(key))??fallback;
  }catch{
    return fallback;
  }
}

function saveJSON(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

// المفتاح الأول دائمًا موجود
function normalizeKeys(value){
  const result=Array.isArray(value)
    ?value.map(x=>String(x||'').trim())
    :[];

  // إزالة الخانات الفارغة الإضافية فقط
  // مع إبقاء المفتاح الأول حتى لو كان فاضيًا
  if(!result.length)return [''];

  return [
    result[0],
    ...result.slice(1).filter(Boolean)
  ];
}

// استيراد الإعدادات السابقة
const oldOther=getJSON('laqta_three_keys',{});
const legacyOther=getJSON('laqta_other_keys',{});
const oldModels=getJSON('laqta_three_models',{});
const legacyModels=getJSON('laqta_models',{});

const savedAll=getJSON('laqta_all_provider_keys',null);

let providerKeys={
  gemini:normalizeKeys(
    savedAll?.gemini??getJSON('gemini_keys',[])
  ),
  openrouter:normalizeKeys(
    savedAll?.openrouter??[
      oldOther.openrouter||legacyOther.openrouter||''
    ]
  ),
  openai:normalizeKeys(
    savedAll?.openai??[
      oldOther.openai||''
    ]
  )
};

let models={
  gemini:GEMINI_MODEL,
  openrouter:
    oldModels.openrouter||
    legacyModels.openrouter||
    'google/gemini-2.5-flash',
  openai:
    oldModels.openai||
    'gpt-4.1-mini'
};

const savedModels=getJSON('laqta_all_models',null);

if(savedModels){
  models.openrouter=
    savedModels.openrouter||models.openrouter;
  models.openai=
    savedModels.openai||models.openai;
}

let mode=localStorage.getItem('laqta_mode')==='manual'
  ?'manual':'auto';

let provider=['gemini','openrouter','openai'].includes(
  localStorage.getItem('laqta_provider')
)
  ?localStorage.getItem('laqta_provider')
  :'gemini';

let selectedKeys=getJSON('laqta_selected_keys',{});

if(typeof selectedKeys!=='object'||!selectedKeys){
  selectedKeys={};
}

if(selectedKeys.gemini===undefined){
  selectedKeys.gemini=
    Number(localStorage.getItem('laqta_selected_key'))||0;
}

for(const p of PROVIDERS){
  const index=Number(selectedKeys[p.id])||0;

  selectedKeys[p.id]=Math.max(
    0,
    Math.min(index,providerKeys[p.id].length-1)
  );
}

let stream=null;
let shot=null;
let busy=false;
let requestId=0;
let activeController=null;
let detailRecord=null;

// الواجهة
function status(message){
  $('answerStatus').textContent=message;
}

function setAnswer(message,type='normal'){
  const el=$('answer');
  el.textContent=message;
  el.className='answer';

  if(type==='loading')el.classList.add('loading');
  if(type==='error')el.classList.add('error');

  if(type==='normal'&&message.length<=80){
    el.classList.add('choice');
  }
}

function showModal(id){
  $(id).classList.remove('hidden');
}

function hideModal(id){
  $(id).classList.add('hidden');
}

function updateTheme(){
  const light=localStorage.getItem('laqta_theme')==='light';

  document.body.classList.toggle('light',light);
  $('themeBtn').textContent=light?'🌙':'☀️';
}

$('themeBtn').onclick=()=>{
  const light=document.body.classList.contains('light');

  localStorage.setItem(
    'laqta_theme',
    light?'dark':'light'
  );

  updateTheme();
};

// اختيار المفتاح يدويًا
function renderKeyChoices(){
  const box=$('keyChoices');
  box.innerHTML='';

  const keys=providerKeys[provider];

  keys.forEach((key,i)=>{
    const button=document.createElement('button');
    button.textContent='مفتاح '+(i+1);

    if(i===selectedKeys[provider]){
      button.classList.add('active');
    }

    button.onclick=()=>{
      selectedKeys[provider]=i;
      saveJSON('laqta_selected_keys',selectedKeys);
      updateMode();
    };

    box.append(button);
  });
}

function updateMode(){
  $('autoBtn').classList.toggle('active',mode==='auto');
  $('manualBtn').classList.toggle('active',mode==='manual');

  $('manualBox').classList.toggle(
    'hidden',mode!=='manual'
  );

  $('modeHint').textContent=
    mode==='auto'
      ?'الوضع التلقائي: جميع مفاتيح Gemini ← OpenRouter ← OpenAI'
      :'الوضع اليدوي: الشركة والمفتاح المحددان فقط';

  document.querySelectorAll('[data-provider]').forEach(b=>{
    b.classList.toggle(
      'active',
      b.dataset.provider===provider
    );
  });

  renderKeyChoices();

  const info=PROVIDERS.find(p=>p.id===provider);

  $('providerHint').textContent=
    'الخدمة المختارة: '+info.name+
    ' — المفتاح '+(selectedKeys[provider]+1);
}

$('autoBtn').onclick=()=>{
  mode='auto';
  localStorage.setItem('laqta_mode',mode);
  updateMode();
};

$('manualBtn').onclick=()=>{
  mode='manual';
  localStorage.setItem('laqta_mode',mode);
  updateMode();
};

document.querySelectorAll('[data-provider]').forEach(b=>{
  b.onclick=()=>{
    provider=b.dataset.provider;
    localStorage.setItem('laqta_provider',provider);
    updateMode();
  };
});

// إعدادات جميع الشركات
let editingKeys={};
let expandedSections={};

function readEditingInputs(){
  for(const p of PROVIDERS){
    const inputs=document.querySelectorAll(
      '[data-key-input="'+p.id+'"]'
    );

    // لا نمسح قيم الشركة المطوية
    if(!expandedSections[p.id])continue;

    editingKeys[p.id]=Array.from(
      inputs,
      input=>input.value
    );

    if(!editingKeys[p.id].length){
      editingKeys[p.id]=[''];
    }
  }
}

function createKeyItem(providerId,index,value){
  const item=document.createElement('div');
  item.className='keyItem';

  const head=document.createElement('div');
  head.className='keyItemHead';

  const label=document.createElement('strong');
  label.textContent=
    'مفتاح '+(index+1)+
    (index===0?' — الأساسي':'');

  head.append(label);

  if(index===0){
    // المفتاح الأول لا يوجد له زر حذف
    const badge=document.createElement('span');
    badge.className='mainKeyBadge';
    badge.textContent='🔒 ثابت';
    head.append(badge);
  }else{
    const remove=document.createElement('button');
    remove.type='button';
    remove.textContent='🗑️ حذف';

    remove.onclick=()=>{
      readEditingInputs();

      // حماية إضافية: ممنوع حذف المفتاح الأول
      if(index===0)return;

      editingKeys[providerId].splice(index,1);
      renderProviderSettings();
    };

    head.append(remove);
  }

  const input=document.createElement('input');
  input.type='password';
  input.className='keyInput';
  input.autocomplete='off';
  input.placeholder='ألصق مفتاح API هنا';
  input.value=value;
  input.dataset.keyInput=providerId;

  input.setAttribute(
    'aria-label',
    'مفتاح '+(index+1)
  );

  item.append(head,input);
  return item;
}

function renderProviderSettings(){
  const container=$('providerSettings');
  container.innerHTML='';

  PROVIDERS.forEach(p=>{
    const section=document.createElement('div');
    section.className='section';

    const toggle=document.createElement('button');
    toggle.className='accordion';
    toggle.type='button';

    const title=document.createElement('span');
    title.textContent=
      p.icon+' '+p.name+
      ' ('+editingKeys[p.id].length+')';

    const arrow=document.createElement('span');
    arrow.className='arrow';
    arrow.textContent='⌄';

    toggle.append(title,arrow);

    const open=!!expandedSections[p.id];

    toggle.classList.toggle('open',open);
    toggle.setAttribute('aria-expanded',String(open));

    toggle.onclick=()=>{
      readEditingInputs();
      expandedSections[p.id]=!expandedSections[p.id];
      renderProviderSettings();
    };

    section.append(toggle);

    const content=document.createElement('div');

    if(!open){
      content.classList.add('hidden');
    }

    const modelField=document.createElement('div');
    modelField.className='field';

    const modelLabel=document.createElement('label');
    modelLabel.textContent='النموذج';
    modelField.append(modelLabel);

    if(p.id==='gemini'){
      const fixed=document.createElement('div');
      fixed.className='fixed';
      fixed.textContent=GEMINI_MODEL;

      const warning=document.createElement('p');
      warning.className='small';
      warning.textContent=
        'اسم هذا النموذج غير مؤكد في Gemini API، وقد يسبب خطأ 404.';

      modelField.append(fixed,warning);
    }else{
      const modelInput=document.createElement('input');
      modelInput.type='text';
      modelInput.value=models[p.id];
      modelInput.autocomplete='off';

      modelInput.addEventListener('input',()=>{
        models[p.id]=modelInput.value;
      });

      modelField.append(modelInput);
    }

    content.append(modelField);

    const keyList=document.createElement('div');

    editingKeys[p.id].forEach((key,i)=>{
      keyList.append(
        createKeyItem(p.id,i,key)
      );
    });

    content.append(keyList);

    const add=document.createElement('button');
    add.className='addKey';
    add.type='button';
    add.textContent='＋ إضافة مفتاح جديد';

    add.onclick=()=>{
      readEditingInputs();

      editingKeys[p.id].push('');
      expandedSections[p.id]=true;

      renderProviderSettings();

      const inputs=document.querySelectorAll(
        '[data-key-input="'+p.id+'"]'
      );

      const last=inputs[inputs.length-1];

      if(last){
        last.focus();
        last.scrollIntoView({
          behavior:'smooth',
          block:'nearest'
        });
      }
    };

    content.append(add);
    section.append(content);
    container.append(section);
  });
}

// الكاميرا
async function startCamera(){
  $('cameraEmpty').classList.add('hidden');
  $('video').classList.remove('hidden');

  if(stream){
    stream.getTracks().forEach(track=>track.stop());
  }

  stream=null;

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:960}
      }
    });

    $('video').srcObject=stream;
    await $('video').play();

  }catch(e){
    console.error(e);
    $('video').classList.add('hidden');
    $('cameraEmpty').classList.remove('hidden');
    status('تعذر تشغيل الكاميرا');
  }
}

$('retryCamera').onclick=startCamera;

function capture(){
  const video=$('video');

  if(!video.videoWidth||!video.videoHeight){
    throw Error('الكاميرا لم تجهز بعد');
  }

  const canvas=document.createElement('canvas');

  const scale=Math.min(
    1,
    1600/Math.max(
      video.videoWidth,
      video.videoHeight
    )
  );

  canvas.width=Math.round(video.videoWidth*scale);
  canvas.height=Math.round(video.videoHeight*scale);

  canvas.getContext('2d').drawImage(
    video,0,0,canvas.width,canvas.height
  );

  return canvas.toDataURL('image/jpeg',.85);
}

function setShot(image){
  shot=image;
  $('preview').src=image;
  $('preview').classList.remove('hidden');
  $('video').classList.add('hidden');

  $('captureBtn').textContent='🔄 التقاط سؤال جديد';
  $('captureBtn').classList.remove('primary');
  $('captureBtn').classList.add('success');
}

function clearShot(){
  requestId++;

  if(activeController){
    activeController.abort();
  }

  busy=false;
  shot=null;

  $('preview').src='';
  $('preview').classList.add('hidden');
  $('video').classList.remove('hidden');

  $('captureBtn').textContent='📸 التقاط السؤال وتحليله';
  $('captureBtn').classList.remove('success');
  $('captureBtn').classList.add('primary');

  setAnswer('الإجابة بتظهر هنا','loading');
  status('وجّه الكاميرا نحو السؤال');

  if(!stream||!stream.active){
    startCamera();
  }
}

$('captureBtn').onclick=async()=>{
  if(busy)return;

  if(shot){
    clearShot();
    return;
  }

  try{
    const image=capture();
    setShot(image);
    await analyze(image);
  }catch(e){
    status('تعذر التقاط الصورة');
    setAnswer(e.message,'error');
  }
};

// تعليمات الإجابة
const PROMPT=[
  'اقرأ السؤال الواضح من الصورة وحدد إجابته الصحيحة.',
  'إذا كان اختيارًا من متعدد، اكتب حرف الخيار الصحيح ونصه فقط.',
  'مثال: c. التنظيم',
  'لا تكتب رقم السؤال أو نص السؤال.',
  'لا تكتب شرحًا أو مقدمة أو تبريرًا.',
  'لا تذكر الخيارات الخاطئة.',
  'إذا ظهرت عدة أسئلة فاختر السؤال الأقرب إلى منتصف الصورة.',
  'إذا كان السؤال مباشرًا فأجب باختصار شديد.',
  'إذا كانت الصورة غير واضحة فاكتب: الصورة غير واضحة.'
].join(' ');

function cleanAnswer(text){
  return String(text||'').trim()
    .replace(/^```(?:text)?\s*/i,'')
    .replace(/\s*```$/i,'')
    .replace(/^\s*(?:السؤال|سؤال)\s*(?:رقم)?\s*\d+\s*[:：.\-–]?\s*/i,'')
    .replace(/^\s*(?:الإجابة الصحيحة|الإجابة|الجواب الصحيح|الجواب)\s*[:：]\s*/i,'')
    .trim();
}

function apiError(data,code){
  return data?.error?.message||
    data?.message||
    'HTTP '+code;
}

async function fetchJSON(url,options,ms=20000){
  const controller=new AbortController();
  activeController=controller;

  const timer=setTimeout(()=>{
    controller.abort();
  },ms);

  try{
    const response=await fetch(url,{
      ...options,
      signal:controller.signal
    });

    const data=await response.json().catch(()=>({}));

    if(!response.ok){
      throw Error(apiError(data,response.status));
    }

    return data;

  }finally{
    clearTimeout(timer);

    if(activeController===controller){
      activeController=null;
    }
  }
}

// Gemini
async function askGemini(key,image){
  const base64=image.split(',')[1];

  const url=
    'https://generativelanguage.googleapis.com/v1beta/models/'+
    encodeURIComponent(GEMINI_MODEL)+
    ':generateContent?key='+
    encodeURIComponent(key);

  const data=await fetchJSON(url,{
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      contents:[{
        parts:[
          {text:PROMPT},
          {
            inline_data:{
              mime_type:'image/jpeg',
              data:base64
            }
          }
        ]
      }],
      generationConfig:{
        temperature:.1,
        maxOutputTokens:400
      }
    })
  });

  const answer=(
    data.candidates?.[0]?.content?.parts||[]
  ).map(x=>x.text||'').join('\n').trim();

  if(!answer){
    throw Error('لم يرجع Gemini إجابة نصية');
  }

  return cleanAnswer(answer);
}

// OpenRouter وOpenAI
async function askCompatible(name,key,image){
  const isOpenAI=name==='openai';

  const url=isOpenAI
    ?'https://api.openai.com/v1/chat/completions'
    :'https://openrouter.ai/api/v1/chat/completions';

  const headers={
    'Content-Type':'application/json',
    Authorization:'Bearer '+key
  };

  if(!isOpenAI){
    headers['X-Title']='Laqta AI';
  }

  const data=await fetchJSON(url,{
    method:'POST',
    headers,
    body:JSON.stringify({
      model:models[name],
      messages:[{
        role:'user',
        content:[
          {type:'text',text:PROMPT},
          {
            type:'image_url',
            image_url:{url:image}
          }
        ]
      }],
      max_tokens:400,
      temperature:.1
    })
  });

  let answer=data.choices?.[0]?.message?.content;

  if(Array.isArray(answer)){
    answer=answer.map(x=>x.text||'').join('\n');
  }

  if(!answer||!String(answer).trim()){
    throw Error('لم يرجع النموذج إجابة نصية');
  }

  return cleanAnswer(answer);
}

// قائمة المحاولات
function jobs(){
  if(mode==='manual'){
    const info=PROVIDERS.find(p=>p.id===provider);

    return [{
      name:info.name,
      kind:provider,
      key:providerKeys[provider][selectedKeys[provider]]||'',
      index:selectedKeys[provider]
    }];
  }

  const allJobs=[];

  for(const p of PROVIDERS){
    const keys=providerKeys[p.id];
    const selected=selectedKeys[p.id]||0;

    const order=keys.length
      ?Array.from(
        {length:keys.length},
        (_,i)=>(selected+i)%keys.length
      )
      :[];

    for(const i of order){
      allJobs.push({
        name:p.name,
        kind:p.id,
        key:keys[i],
        index:i
      });
    }
  }

  return allJobs;
}

// تحليل السؤال
async function analyze(image){
  busy=true;
  const myId=++requestId;

  setAnswer('جاري تحليل السؤال...','loading');

  const attempts=jobs().filter(job=>job.key);

  if(!attempts.length){
    busy=false;
    status('لا توجد مفاتيح محفوظة');
    setAnswer(
      'اضغط 🔑 وأضف مفتاح API أولًا',
      'error'
    );
    return;
  }

  const errors=[];

  try{
    for(const job of attempts){
      if(myId!==requestId)return;

      status(
        '⏳ جارٍ التحليل عبر '+job.name+
        ' — مفتاح '+(job.index+1)
      );

      try{
        const answer=job.kind==='gemini'
          ?await askGemini(job.key,image)
          :await askCompatible(
              job.kind,job.key,image
            );

        if(myId!==requestId)return;

        setAnswer(answer);
        status(
          'تم التحليل عبر '+job.name+
          ' — مفتاح '+(job.index+1)+' ✓'
        );

        try{
          await addHistory({
            image,
            answer,
            provider:job.name+
              ' — مفتاح '+(job.index+1),
            createdAt:Date.now()
          });
        }catch(e){
          console.warn('History save failed',e);
          status('تم التحليل — تعذر حفظ السجل');
        }

        return;

      }catch(e){
        if(myId!==requestId)return;

        errors.push(
          job.name+' ('+(job.index+1)+'): '+
          e.message
        );
      }
    }

    status('تعذر تحليل السؤال');

    setAnswer(
      errors.join('\n\n')||
      'حدث خطأ غير معروف',
      'error'
    );

  }finally{
    if(myId===requestId)busy=false;
  }
}

// الأرشيف
const DB_NAME='LaqtaAIHistory';
const STORE='questions';

let dbPromise;

function db(){
  if(!dbPromise){
    dbPromise=new Promise((resolve,reject)=>{
      const req=indexedDB.open(DB_NAME,1);

      req.onupgradeneeded=()=>{
        const database=req.result;

        if(!database.objectStoreNames.contains(STORE)){
          database.createObjectStore(STORE,{
            keyPath:'id',
            autoIncrement:true
          });
        }
      };

      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }

  return dbPromise;
}

async function addHistory(item){
  const database=await db();

  return new Promise((resolve,reject)=>{
    const req=database.transaction(
      STORE,'readwrite'
    ).objectStore(STORE).add(item);

    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

async function allHistory(){
  const database=await db();

  return new Promise((resolve,reject)=>{
    const req=database.transaction(STORE)
      .objectStore(STORE).getAll();

    req.onsuccess=()=>resolve(
      req.result.sort(
        (a,b)=>b.createdAt-a.createdAt
      )
    );
    req.onerror=()=>reject(req.error);
  });
}

async function deleteHistory(id){
  const database=await db();

  return new Promise((resolve,reject)=>{
    const req=database.transaction(
      STORE,'readwrite'
    ).objectStore(STORE).delete(id);

    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}

async function clearHistory(){
  const database=await db();

  return new Promise((resolve,reject)=>{
    const req=database.transaction(
      STORE,'readwrite'
    ).objectStore(STORE).clear();

    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}

let historyCache=[];

async function renderHistory(){
  $('historyList').textContent=
    'جاري تحميل السجل...';

  try{
    historyCache=await allHistory();
    filterHistory();
  }catch(e){
    $('historyList').textContent=
      'تعذر فتح السجل: '+e.message;
  }
}

function filterHistory(){
  const q=$('historySearch').value
    .trim().toLowerCase();

  const list=$('historyList');
  list.innerHTML='';

  const records=historyCache.filter(r=>
    (r.answer||'').toLowerCase().includes(q)||
    new Date(r.createdAt)
      .toLocaleString('ar-SA').includes(q)
  );

  if(!records.length){
    list.textContent='لا توجد نتائج في السجل';
    return;
  }

  records.forEach(r=>{
    const box=document.createElement('div');
    box.className='listitem';

    const img=document.createElement('img');
    img.src=r.image;
    img.alt='صورة السؤال';

    const date=document.createElement('div');
    date.className='small';
    date.textContent=
      new Date(r.createdAt).toLocaleString('ar-SA')+
      ' — '+(r.provider||'AI');

    const answer=document.createElement('p');
    answer.textContent=(r.answer||'').slice(0,180);

    const actions=document.createElement('div');
    actions.className='row';

    const view=document.createElement('button');
    view.textContent='👁️ عرض وحفظ ومشاركة';
    view.onclick=()=>openDetail(r);

    const del=document.createElement('button');
    del.textContent='🗑️ حذف';
    del.className='danger';

    del.onclick=async()=>{
      if(!confirm('حذف هذا السؤال؟'))return;
      await deleteHistory(r.id);
      await renderHistory();
    };

    actions.append(view,del);
    box.append(img,date,answer,actions);
    list.append(box);
  });
}

// حفظ ومشاركة الصور
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');

  link.href=url;
  link.download=name;
  document.body.append(link);
  link.click();
  link.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    10000
  );
}

async function dataToBlob(data){
  return (await fetch(data)).blob();
}

async function saveData(data,name){
  downloadBlob(
    await dataToBlob(data),
    name
  );
}

async function shareBlob(blob,name,text){
  const file=new File([blob],name,{
    type:blob.type||'image/png'
  });

  if(
    navigator.share&&
    navigator.canShare?.({files:[file]})
  ){
    await navigator.share({
      files:[file],
      title:'لقطة AI',
      text
    });
  }else{
    downloadBlob(blob,name);
  }
}

function imageLoaded(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}

function wrapLines(ctx,text,maxWidth){
  const lines=[];

  for(const paragraph of text.split('\n')){
    let line='';

    for(const word of paragraph.split(/\s+/)){
      const test=line?line+' '+word:word;

      if(
        ctx.measureText(test).width>maxWidth&&
        line
      ){
        lines.push(line);
        line=word;
      }else{
        line=test;
      }
    }

    lines.push(line);
  }

  return lines;
}

async function combinedBlob(record){
  const img=await imageLoaded(record.image);
  const width=1000;
  const padding=50;

  let imageHeight=Math.round(
    img.height*width/img.width
  );

  imageHeight=Math.min(imageHeight,1200);

  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');

  ctx.font='bold 38px system-ui';

  const lines=wrapLines(
    ctx,
    record.answer,
    width-padding*2
  );

  canvas.width=width;
  canvas.height=
    imageHeight+
    padding*3+
    Math.max(130,lines.length*62);

  ctx.fillStyle='#fff';
  ctx.fillRect(
    0,0,canvas.width,canvas.height
  );

  ctx.fillStyle='#0b1220';
  ctx.fillRect(
    0,0,width,imageHeight+padding
  );

  ctx.drawImage(
    img,0,0,width,imageHeight
  );

  ctx.direction='rtl';
  ctx.textAlign='right';
  ctx.fillStyle='#111827';
  ctx.font='bold 38px system-ui';

  lines.forEach((line,i)=>{
    ctx.fillText(
      line,
      width-padding,
      imageHeight+padding+65+i*62
    );
  });

  ctx.fillStyle='#6b7280';
  ctx.font='24px system-ui';
  ctx.fillText(
    'لقطة AI',
    width-padding,
    canvas.height-25
  );

  return new Promise(resolve=>{
    canvas.toBlob(
      resolve,'image/png'
    );
  });
}
