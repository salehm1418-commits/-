
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c14">

<title>لقطة AI | حل الأسئلة بالكاميرا</title>
<meta name="description" content="لقطة AI — صوّر سؤالك واحصل على إجابة مختصرة بمساعدة الذكاء الاصطناعي.">

<meta property="og:type" content="website">
<meta property="og:title" content="لقطة AI | حل الأسئلة بالكاميرا">
<meta property="og:description" content="وجّه الكاميرا نحو السؤال، التقط الصورة، وشاهد الإجابة بسهولة.">
<meta property="og:url" content="https://salehm1418-commits.github.io/-/">
<meta property="og:image" content="https://salehm1418-commits.github.io/-/share.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<style>
:root {
  --blue:#2563eb;
  --green:#059669;
  --bg:#080c14;
  --card:#0f172a;
  --border:#263449;
}
* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
}

button,input {font:inherit}
button {cursor:pointer;color:white}

.top {
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  background:#0f172af5;
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + 9px) 12px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.logo {
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}

.logo img {
  width:27px;
  height:27px;
  border-radius:7px;
}

.top h1 {
  font-size:14px;
  margin:0;
  white-space:nowrap;
}

.top-actions {
  display:flex;
  align-items:center;
  gap:7px;
}

.small {
  border:1px solid #334155;
  background:#1e293b;
  border-radius:10px;
  padding:8px 9px;
  font-size:14px;
}

.controls {
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.controls .toggle {
  padding:8px 9px;
  border:1px solid #334155;
  border-radius:9px;
  background:#1e293b;
  font-size:12px;
  font-weight:700;
}

.controls .toggle.active,
.number.active {
  background:var(--blue);
  border-color:var(--blue);
}

.numbers {
  display:flex;
  gap:3px;
}

.number {
  min-width:26px;
  padding:7px 3px;
  border:1px solid #334155;
  border-radius:7px;
  background:#1e293b;
  font-size:12px;
}

.number:disabled {
  opacity:.3;
  cursor:not-allowed;
}

main {
  max-width:520px;
  margin:auto;
  padding:calc(env(safe-area-inset-top) + 102px) 12px 28px;
}

.camera {
  width:100%;
  height:62dvh;
  min-height:320px;
  background:#030712;
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
}

.camera video,
.camera img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.camera img,
#canvas {
  display:none;
}

#captureBtn {
  display:block;
  width:100%;
  margin-top:12px;
  background:var(--blue);
  border:0;
  border-radius:13px;
  padding:17px;
  font-size:18px;
  font-weight:750;
}

.result {
  display:none;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  margin-top:12px;
  padding:17px;
}

#status {
  color:#38bdf8;
  font-size:17px;
  font-weight:700;
}

#answer {
  font-size:26px;
  font-weight:800;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin-top:10px;
}

.overlay {
  position:fixed;
  inset:0;
  z-index:50;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.panel {
  background:#101b30;
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  width:min(100%,440px);
  max-height:85dvh;
  overflow-y:auto;
}

.panel h2 {
  margin:0 0 14px;
  font-size:19px;
}

.muted {
  color:#a8b5c7;
  font-size:13px;
  line-height:1.7;
}

.panel label {
  display:block;
  margin:11px 0 5px;
  color:#cbd5e1;
  font-size:13px;
}

.panel input {
  width:100%;
  background:#060d19;
  border:1px solid #334155;
  color:#fff;
  padding:12px;
  border-radius:9px;
  direction:ltr;
}

.panel-footer {
  display:flex;
  gap:8px;
  margin-top:16px;
}

.panel-footer button {
  flex:1;
  background:var(--blue);
  border:0;
  border-radius:10px;
  padding:13px;
}

.panel-footer button.secondary {
  background:#475569;
}

@media(max-width:390px) {
  .top {gap:5px}
  .controls {gap:3px}
  .controls .toggle {padding:7px 6px}
  .number {min-width:23px;padding:6px 2px}
  .top h1 {font-size:13px}
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">
    <img src="logo.png" alt="شعار لقطة AI">
    <h1>لقطة AI</h1>
  </div>

  <div class="top-actions">
    <div class="controls">
      <button id="autoBtn" class="toggle" onclick="setMode('auto')">
        ⚡ أوتو
      </button>

      <button id="manualBtn" class="toggle" onclick="setMode('manual')">
        ✋ يدوي
      </button>

      <div id="keyGrid" class="numbers" aria-label="اختيار رقم المفتاح"></div>
    </div>

    <button
      class="small"
      onclick="openSettings()"
      aria-label="إدارة مفاتيح Gemini"
      title="إدارة المفاتيح"
    >🔑</button>
  </div>
</header>

<main>
  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="السؤال المصور">
    <canvas id="canvas"></canvas>
  </div>

  <button id="captureBtn" onclick="mainAction()">
    📸 التقاط وتحليل فوري
  </button>

  <section class="result" id="result">
    <div id="status"></div>
    <div id="answer"></div>
  </section>
</main>

<div class="overlay" id="settingsOverlay">
  <div class="panel" role="dialog" aria-modal="true">
    <h2>🔑 إدارة مفاتيح Gemini</h2>

    <p class="muted">
      كل شخص يضيف مفاتيحه الخاصة في متصفحه.
      يمكنك حفظ حتى 5 مفاتيح، وترك الخانات غير المستخدمة فارغة.
    </p>

    <div id="keyInputs"></div>

    <div class="panel-footer">
      <button onclick="saveSettings()">حفظ المفاتيح</button>
      <button class="secondary" onclick="closeSettings()">إلغاء</button>
    </div>
  </div>
</div>

<script>
'use strict';

// النموذج المطلوب، بشرط أن يكون متاحاً لحسابك
const MODEL = 'gemini-3.8-flash';

const $ = id => document.getElementById(id);

const video = $('video');
const photo = $('photo');
const canvas = $('canvas');
const captureBtn = $('captureBtn');
const result = $('result');
const statusEl = $('status');
const answerEl = $('answer');

let keys = [];
let selected = 0;
let mode = localStorage.getItem('gemini_mode') === 'manual'
  ? 'manual' : 'auto';

let captured = false;
let imageData = '';
let controller = null;
let requestId = 0;

function load() {
  try {
    const stored = JSON.parse(
      localStorage.getItem('gemini_keys') || '[]'
    );

    keys = Array.isArray(stored)
      ? stored.slice(0,5).map(x =>
          typeof x === 'string' ? x.trim() : ''
        )
      : [];
  } catch {
    keys = [];
  }

  // استرجاع المفتاح القديم إن وجد
  const old = localStorage.getItem('gemini_key');

  if (!keys.some(Boolean) && old) {
    keys = [old.trim()];
  }

  while (keys.length < 5) {
    keys.push('');
  }

  selected = Number(
    localStorage.getItem('selected_gemini_key') || 0
  );

  if (
    !Number.isInteger(selected) ||
    selected < 0 ||
    selected >= 5
  ) {
    selected = 0;
  }

  if (!keys[selected]) {
    const first = keys.findIndex(Boolean);
    if (first >= 0) selected = first;
  }

  renderMode();
  startCamera();

  if (!keys.some(Boolean)) {
    result.style.display = 'block';
    statusEl.textContent = '👋 مرحباً بك في لقطة AI';
    answerEl.textContent =
      'اضغط زر 🔑 وأضف مفتاح Gemini الخاص بك للبدء.';
  }
}

function stopRequest() {
  requestId++;

  if (controller) {
    controller.abort();
    controller = null;
  }
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode:'environment',
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();
  } catch (e) {
    console.error(e);
    result.style.display = 'block';
    statusEl.textContent = 'تعذر فتح الكاميرا';
    answerEl.textContent =
      'اسمح للموقع باستخدام الكاميرا من إعدادات المتصفح.';
  }
}

function mainAction() {
  if (captured) {
    reset();
    return;
  }

  if (!video.videoWidth) {
    alert('انتظر حتى تعمل الكاميرا');
    return;
  }

  stopRequest();

  const scale = Math.min(
    1,
    1280 / Math.max(video.videoWidth,video.videoHeight)
  );

  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);

  canvas.getContext('2d').drawImage(
    video,0,0,canvas.width,canvas.height
  );

  imageData = canvas.toDataURL('image/jpeg',0.75);

  photo.src = imageData;
  photo.style.display = 'block';
  video.style.display = 'none';

  captured = true;
  captureBtn.textContent = '🔄 التقاط سؤال جديد';
  captureBtn.style.background = '#059669';

  analyze(imageData);
}

function reset() {
  stopRequest();

  captured = false;
  imageData = '';

  photo.style.display = 'none';
  video.style.display = 'block';
  result.style.display = 'none';

  answerEl.textContent = '';
  captureBtn.textContent = '📸 التقاط وتحليل فوري';
  captureBtn.style.background = '#2563eb';
}

function setMode(nextMode) {
  if (mode !== nextMode) {
    stopRequest();

    mode = nextMode;
    localStorage.setItem('gemini_mode',mode);

    if (captured) {
      statusEl.textContent = 'تم تغيير الوضع';
      answerEl.textContent =
        'اضغط التقاط سؤال جديد للمتابعة.';
    }
  }

  renderMode();
}

function chooseKey(index) {
  if (!keys[index]) return;

  stopRequest();

  selected = index;

  localStorage.setItem(
    'selected_gemini_key',
    String(index)
  );

  if (captured) {
    statusEl.textContent =
      'تم اختيار المفتاح رقم ' + (index+1);

    answerEl.textContent =
      'اضغط التقاط سؤال جديد للمتابعة.';
  }

  renderMode();
}

function renderMode() {
  $('autoBtn').classList.toggle(
    'active',mode === 'auto'
  );

  $('manualBtn').classList.toggle(
    'active',mode === 'manual'
  );

  const grid = $('keyGrid');

  grid.style.display =
    mode === 'manual' ? 'flex' : 'none';

  grid.innerHTML = '';

  for (let i=0;i<5;i++) {
    const button = document.createElement('button');

    button.className = 'number';
    button.textContent = String(i+1);
    button.disabled = !keys[i];

    button.classList.toggle(
      'active',
      i === selected && !!keys[i]
    );

    button.title = keys[i]
      ? 'المفتاح رقم ' + (i+1)
      : 'لم يتم حفظ هذا المفتاح';

    button.onclick = () => chooseKey(i);

    grid.appendChild(button);
  }
}

function openSettings() {
  const area = $('keyInputs');
  area.innerHTML = '';

  for (let i=0;i<5;i++) {
    const label = document.createElement('label');
    label.textContent = 'المفتاح رقم ' + (i+1);

    const input = document.createElement('input');
    input.type = 'password';
    input.id = 'key' + i;
    input.autocomplete = 'off';
    input.placeholder = 'AIzaSy...';
    input.value = keys[i] || '';

    area.append(label,input);
  }

  $('settingsOverlay').style.display = 'flex';
}

function closeSettings() {
  $('settingsOverlay').style.display = 'none';
}

function saveSettings() {
  const next = [];

  for (let i=0;i<5;i++) {
    next.push($('key'+i).value.trim());
  }

  stopRequest();

  // كل مفتاح يحتفظ برقم خانته
  keys = next;

  if (!keys[selected]) {
    const first = keys.findIndex(Boolean);
    selected = first >= 0 ? first : 0;
  }

  localStorage.setItem(
    'gemini_keys',
    JSON.stringify(keys)
  );

  localStorage.setItem(
    'selected_gemini_key',
    String(selected)
  );

  localStorage.removeItem('gemini_key');

  closeSettings();
  renderMode();

  if (captured) {
    statusEl.textContent = 'تم حفظ المفاتيح';
    answerEl.textContent =
      'اضغط التقاط سؤال جديد للمتابعة.';
  } else if (keys.some(Boolean)) {
    result.style.display = 'block';
    statusEl.textContent = '✅ تم حفظ المفاتيح';
    answerEl.textContent =
      'وجّه الكاميرا نحو السؤال واضغط التقاط.';
  }

  alert('تم حفظ مفاتيحك في هذا المتصفح');
}

function waitText(message) {
  const match = String(message).match(
    /Please retry in\s+((?:\d+h)?(?:\d+m)?(?:\d+(?:\.\d+)?s)?)/i
  );

  if (!match) return '';

  const value = match[1];

  const hours = +(value.match(/(\d+)h/)?.[1] || 0);
  const minutes = +(value.match(/(\d+)m/)?.[1] || 0);
  const seconds = +(
    value.match(/(\d+(?:\.\d+)?)s/)?.[1] || 0
  );

  const total = Math.ceil(
    hours*3600 + minutes*60 + seconds
  );

  if (total >= 3600) {
    return Math.ceil(total/3600) + ' ساعة تقريباً';
  }

  if (total >= 60) {
    return Math.ceil(total/60) + ' دقيقة تقريباً';
  }

  return total ? total + ' ثانية' : '';
}

function errorText(error) {
  const message = error.message || '';

  if (error.refusal) {
    return 'لم يتمكن النموذج من الإجابة عن هذا الطلب.';
  }

  if (
    error.status === 429 ||
    /quota exceeded|resource.exhausted/i.test(message)
  ) {
    const wait = waitText(message);

    return 'انتهت حصة الاستخدام للمشروع الحالي.' +
      (wait ? ' حاول بعد ' + wait + '.' : '') +
      ' تحقق من حدود الاستخدام أو الفوترة.';
  }

  if (
    error.status === 503 ||
    /high demand|overloaded/i.test(message)
  ) {
    return 'خوادم Gemini مشغولة، حاول بعد قليل.';
  }

  if (
    error.status === 400 ||
    error.status === 404
  ) {
    return 'تحقق من إتاحة النموذج للمفتاح المختار.';
  }

  if (
    error.status === 401 ||
    error.status === 403
  ) {
    return 'المفتاح غير صالح أو لا يملك الصلاحية المطلوبة.';
  }

  return 'تعذر الحصول على إجابة. تحقق من الاتصال والمفتاح.';
}

function keyError(error) {
  const message = error.message || '';

  return error.status === 401 || (
    error.status === 403 &&
    /api key|invalid key|key not valid|api_key/i.test(message) &&
    !/quota|safety|policy/i.test(message)
  );
}

function sleep(ms,signal) {
  return new Promise((resolve,reject) => {
    if (signal.aborted) {
      reject(new DOMException('Cancelled','AbortError'));
      return;
    }

    const timer = setTimeout(() => {
      signal.removeEventListener('abort',onAbort);
      resolve();
    },ms);

    function onAbort() {
      clearTimeout(timer);
      reject(new DOMException('Cancelled','AbortError'));
    }

    signal.addEventListener(
      'abort',onAbort,{once:true}
    );
  });
}

async function ask(key,image,signal) {
  const response = await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/' +
    encodeURIComponent(MODEL) +
    ':generateContent?key=' +
    encodeURIComponent(key),
    {
      method:'POST',
      signal,
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        contents:[{
          parts:[
            {
              text:
                'اقرأ السؤال والخيارات في الصورة. ' +
                'أجب بحرف الخيار الصحيح ونصه في سطر واحد دون شرح. ' +
                'إذا كانت الصورة غير واضحة فاذكر ذلك، ولا تخمّن.'
            },
            {
              inline_data:{
                mime_type:'image/jpeg',
                data:image.split(',')[1]
              }
            }
          ]
        }],
        generationConfig:{
          temperature:0,
          maxOutputTokens:256
        }
      })
    }
  );

  const data = await response.json().catch(() => ({}));

  if (!response.ok || data.error) {
    const error = new Error(
      data.error?.message || 'فشل الطلب'
    );

    error.status = response.status;
    throw error;
  }

  const candidate = data.candidates?.[0];

  const text = candidate?.content?.parts
    ?.filter(part => typeof part.text === 'string')
    .map(part => part.text)
    .join('\n');

  if (!text?.trim()) {
    const error = new Error('لم تصل إجابة');

    if (
      data.promptFeedback?.blockReason ||
      ['SAFETY','PROHIBITED_CONTENT'].includes(
        candidate?.finishReason
      )
    ) {
      error.refusal = true;
    }

    throw error;
  }

  return text.replace(/\*\*/g,'').trim();
}

async function analyze(image) {
  result.style.display = 'block';
  answerEl.textContent = '';

  if (!keys.some(Boolean)) {
    statusEl.textContent = '⚠️ لا يوجد مفتاح';
    answerEl.textContent =
      'أضف مفتاح Gemini الخاص بك من زر 🔑.';
    return;
  }

  if (!keys[selected]) {
    statusEl.textContent = '⚠️ المفتاح غير محفوظ';
    answerEl.textContent =
      'اختر مفتاحاً محفوظاً أو أضفه من زر 🔑.';
    return;
  }

  stopRequest();

  const id = requestId;
  const active = new AbortController();

  controller = active;

  // يدوي: المفتاح المختار فقط
  // أوتو: الانتقال عند أخطاء صلاحية المفتاح فقط
  const order = mode === 'auto'
    ? [
        selected,
        ...keys.map((_,i) => i).filter(
          i => i !== selected && !!keys[i]
        )
      ]
    : [selected];

  try {
    for (let n=0;n<order.length;n++) {
      const index = order[n];

      if (!keys[index]) continue;

      statusEl.textContent =
        '⏳ جاري التحليل بالمفتاح رقم ' +
        (index+1) + '...';

      let lastError;

      for (let retry=0;retry<2;retry++) {
        try {
          const text = await ask(
            keys[index],
            image,
            active.signal
          );

          if (id !== requestId) return;

          selected = index;

          localStorage.setItem(
            'selected_gemini_key',
            String(index)
          );

          renderMode();

          statusEl.textContent =
            '✅ الإجابة — المفتاح رقم ' +
            (index+1);

          answerEl.textContent = text;
          return;

        } catch (error) {
          if (
            id !== requestId ||
            active.signal.aborted
          ) return;

          lastError = error;

          if (
            error.refusal ||
            error.status === 429 ||
            error.status === 400 ||
            error.status === 404 ||
            (
              error.status === 403 &&
              !keyError(error)
            )
          ) {
            throw error;
          }

          if (keyError(error)) break;

          const temporary =
            [500,502,503,504].includes(error.status) ||
            error instanceof TypeError;

          if (temporary && retry === 0) {
            statusEl.textContent =
              '⏳ إعادة المحاولة بعد عطل مؤقت...';

            await sleep(900,active.signal);
            continue;
          }

          throw error;
        }
      }

      if (
        mode === 'auto' &&
        keyError(lastError) &&
        n < order.length-1
      ) {
        continue;
      }

      throw lastError;
    }

    throw new Error('لا يوجد مفتاح صالح متاح');

  } catch (error) {
    if (
      id !== requestId ||
      error.name === 'AbortError'
    ) return;

    console.error(error);

    statusEl.textContent = '❌ تعذر تحليل السؤال';
    answerEl.textContent = errorText(error);

  } finally {
    if (id === requestId) {
      controller = null;
    }
  }
}

load();
</script>
</body>
</html>
