<script>
'use strict';

const MODEL = 'gemini-3.8-flash';
const $ = id => document.getElementById(id);

const video = $('video');
const photo = $('photo');
const captureBtn = $('capture');
const note = $('cameraNote');
const result = $('result');
const statusEl = $('status');
const answerEl = $('answer');

let keys = Array(5).fill('');
let selected = 0;
let mode = localStorage.getItem('gemini_mode') === 'manual'
  ? 'manual' : 'auto';

let captured = false;
let controller = null;
let requestId = 0;
let historyCache = [];
let currentDetail = null;

/* المظهر */
function updateThemeButton() {
  const light =
    document.documentElement.dataset.theme === 'light';

  $('themeButton').textContent = light ? '🌙' : '☀️';

  $('themeButton').title = light
    ? 'الوضع الداكن'
    : 'الوضع الفاتح';

  $('themeColor').content = light
    ? '#f3f6fc'
    : '#080c14';
}

function toggleTheme() {
  const current =
    document.documentElement.dataset.theme;

  const next = current === 'light' ? 'dark' : 'light';

  document.documentElement.dataset.theme = next;

  try {
    localStorage.setItem('laqta_theme',next);
  } catch(e) {}

  updateThemeButton();
}

/* قاعدة بيانات السجل */
const DB_NAME = 'LaqtaAIHistory';
const STORE_NAME = 'questions';

let dbPromise = null;

function openDatabase() {
  if (!window.indexedDB) {
    return Promise.reject(
      new Error('المتصفح لا يدعم حفظ السجل')
    );
  }

  if (dbPromise) return dbPromise;

  dbPromise = new Promise((resolve,reject) => {
    const request = indexedDB.open(DB_NAME,1);

    request.onupgradeneeded = () => {
      const db = request.result;

      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(
          STORE_NAME,
          {keyPath:'id',autoIncrement:true}
        );

        store.createIndex('createdAt','createdAt');
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  }).catch(e => {
    dbPromise = null;
    throw e;
  });

  return dbPromise;
}

async function saveHistory(image,answer) {
  const db = await openDatabase();

  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE_NAME,'readwrite');

    tx.objectStore(STORE_NAME).add({
      image,
      answer,
      createdAt:Date.now()
    });

    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function getHistory() {
  const db = await openDatabase();

  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE_NAME,'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();

    req.onsuccess = () => {
      const items = req.result || [];

      items.sort((a,b) => b.createdAt-a.createdAt);
      resolve(items);
    };

    req.onerror = () => reject(req.error);
  });
}

async function deleteHistoryItem(id) {
  const db = await openDatabase();

  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE_NAME,'readwrite');

    tx.objectStore(STORE_NAME).delete(id);

    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function deleteAllHistory() {
  const db = await openDatabase();

  return new Promise((resolve,reject) => {
    const tx = db.transaction(STORE_NAME,'readwrite');

    tx.objectStore(STORE_NAME).clear();

    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function formatDate(timestamp) {
  return new Date(timestamp).toLocaleString('ar-SA',{
    year:'numeric',
    month:'short',
    day:'numeric',
    hour:'numeric',
    minute:'2-digit'
  });
}

/* فتح السجل */
async function openHistory() {
  $('historyOverlay').classList.add('open');
  $('historySearch').value = '';
  $('historyList').textContent = 'جاري تحميل السجل...';

  try {
    historyCache = await getHistory();
    renderHistory();
  } catch(e) {
    $('historyList').textContent =
      'تعذر فتح السجل: '+e.message;
  }
}

function closeHistory() {
  $('historyOverlay').classList.remove('open');
}

function renderHistory() {
  const list = $('historyList');
  const search =
    $('historySearch').value.trim().toLowerCase();

  list.replaceChildren();

  $('historyCount').textContent =
    historyCache.length+' سؤال';

  const filtered = historyCache.filter(item =>
    item.answer.toLowerCase().includes(search) ||
    formatDate(item.createdAt).includes(search)
  );

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';

    empty.textContent = search
      ? 'ما لقينا نتيجة مطابقة.'
      : 'السجل فارغ. صوّر أول سؤال وبتلقاه هنا.';

    list.append(empty);
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'history-item';

    const img = document.createElement('img');
    img.className = 'history-thumb';
    img.src = item.image;
    img.loading = 'lazy';

    const info = document.createElement('div');
    info.className = 'history-info';

    const answer = document.createElement('div');
    answer.className = 'history-answer';
    answer.textContent = item.answer;

    const date = document.createElement('div');
    date.className = 'history-date';
    date.textContent = formatDate(item.createdAt);

    const actions = document.createElement('div');
    actions.className = 'history-buttons';

    const openBtn = document.createElement('button');
    openBtn.textContent = '👁️ عرض';
    openBtn.onclick = () => showHistoryDetail(item.id);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete';
    deleteBtn.textContent = '🗑️ حذف';
    deleteBtn.onclick = () => removeHistoryItem(item.id);

    actions.append(openBtn,deleteBtn);
    info.append(answer,date,actions);
    card.append(img,info);
    list.append(card);
  });
}

function showHistoryDetail(id) {
  const item = historyCache.find(x => x.id === id);
  if (!item) return;

  currentDetail = item;

  $('detailImage').src = item.image;
  $('detailAnswer').textContent = item.answer;
  $('detailDate').textContent = formatDate(item.createdAt);

  $('detailOverlay').classList.add('open');
}

function closeDetail() {
  $('detailOverlay').classList.remove('open');
  $('detailImage').removeAttribute('src');
  currentDetail = null;
}

async function removeHistoryItem(id) {
  if (!confirm('تبي تحذف هذا السؤال؟')) return;

  try {
    await deleteHistoryItem(id);

    historyCache = historyCache.filter(
      item => item.id !== id
    );

    renderHistory();
  } catch(e) {
    alert('تعذر الحذف: '+e.message);
  }
}

async function clearHistory() {
  if (!historyCache.length) return;

  if (!confirm(
    'متأكد تبي تمسح جميع الصور والإجابات؟'
  )) return;

  try {
    await deleteAllHistory();
    historyCache = [];
    renderHistory();
  } catch(e) {
    alert('تعذر مسح السجل: '+e.message);
  }
}

/* ======================================
   حفظ الصور والمشاركة - الميزات الجديدة
   ====================================== */

/* تحويل صورة محفوظة إلى ملف */
async function imageToFile(dataUrl,filename) {
  const response = await fetch(dataUrl);
  const blob = await response.blob();

  return new File(
    [blob],
    filename,
    {type:'image/jpeg'}
  );
}

/* تنزيل ملف */
function downloadFile(blob,filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url),60000);
}

/* مشاركة ملف عبر الآيفون أو تنزيله */
async function shareOrDownload(file,text) {
  try {
    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ) {
      await navigator.share({
        files:[file],
        text:text || ''
      });
      return;
    }
  } catch(e) {
    if (e.name === 'AbortError') return;
  }

  downloadFile(file,file.name);
}

  }

/* تقسيم النص إلى أسطر داخل الصورة */
function wrapText(ctx,text,maxWidth) {
  const lines = [];

  for (const paragraph of text.split('\n')) {
    if (!paragraph.trim()) {
      lines.push('');
      continue;
    }

    const words = paragraph.split(/\s+/);
    let line = '';

    for (const word of words) {
      const candidate = line ? line+' '+word : word;

      if (
        ctx.measureText(candidate).width <= maxWidth
      ) {
        line = candidate;
      } else {
        if (line) lines.push(line);

        if (ctx.measureText(word).width <= maxWidth) {
          line = word;
        } else {
          let part = '';

          for (const char of word) {
            if (
              part &&
              ctx.measureText(part+char).width > maxWidth
            ) {
              lines.push(part);
              part = char;
            } else {
              part += char;
            }
          }

          line = part;
        }
      }
    }

    if (line) lines.push(line);
  }

  return lines;
}

/* إنشاء صورة السؤال والإجابة */
async function createCombinedImage(item) {
  const original = new Image();
  original.src = item.image;

  await original.decode();

  const width = 1080;
  const margin = 55;
  const contentWidth = width-margin*2;

  const imageScale = Math.min(
    contentWidth/original.naturalWidth,
    1250/original.naturalHeight
  );

  const imageWidth = Math.round(
    original.naturalWidth*imageScale
  );

  const imageHeight = Math.round(
    original.naturalHeight*imageScale
  );

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  ctx.font = 'bold 39px system-ui, sans-serif';
  ctx.direction = 'rtl';

  const lines = wrapText(
    ctx,
    item.answer,
    contentWidth-40
  );

  const lineHeight = 63;

  const answerHeight = Math.max(
    125,
    lines.length*lineHeight+65
  );

  const top = 140;
  const imageTop = 175;
  const answerTop = imageTop+imageHeight+45;

  canvas.width = width;
  canvas.height = Math.ceil(
    answerTop+answerHeight+105
  );

  /* الخلفية */
  ctx.fillStyle = '#f4f7fc';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  /* العنوان */
  ctx.fillStyle = '#172b48';
  ctx.textAlign = 'right';
  ctx.direction = 'rtl';
  ctx.font = 'bold 49px system-ui, sans-serif';
  ctx.fillText('لقطة AI',width-margin,82);

  ctx.fillStyle = '#64748b';
  ctx.font = '26px system-ui, sans-serif';
  ctx.fillText(
    formatDate(item.createdAt),
    width-margin,
    125
  );

  /* خلفية صورة السؤال */
  ctx.fillStyle = '#fff';
  ctx.fillRect(
    margin-8,
    imageTop-8,
    contentWidth+16,
    imageHeight+16
  );

  ctx.drawImage(
    original,
    (width-imageWidth)/2,
    imageTop,
    imageWidth,
    imageHeight
  );

  /* مربع الإجابة */
  ctx.fillStyle = '#e4f4ed';
  ctx.fillRect(
    margin,
    answerTop,
    contentWidth,
    answerHeight
  );

  ctx.fillStyle = '#047857';
  ctx.font = 'bold 31px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(
    'الإجابة',
    width-margin-20,
    answerTop+46
  );

  ctx.fillStyle = '#12263a';
  ctx.font = 'bold 39px system-ui, sans-serif';

  lines.forEach((line,i) => {
    ctx.fillText(
      line,
      width-margin-20,
      answerTop+105+i*lineHeight
    );
  });

  /* التوقيع */
  ctx.fillStyle = '#64748b';
  ctx.font = '25px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(
    'تم إنشاؤها بواسطة لقطة AI',
    width/2,
    canvas.height-38
  );

  const blob = await new Promise((resolve,reject) => {
    canvas.toBlob(
      b => b ? resolve(b) : reject(
        new Error('تعذر إنشاء الصورة')
      ),
      'image/jpeg',
      .92
    );
  });

  return new File(
    [blob],
    'laqta-answer-'+item.id+'.jpg',
    {type:'image/jpeg'}
  );
}

/* ======================================
   المفاتيح والأوضاع
   ====================================== */

function load() {
  updateThemeButton();

  try {
    const saved = JSON.parse(
      localStorage.getItem('gemini_keys') || '[]'
    );

    if (Array.isArray(saved)) {
      saved.slice(0,5).forEach((v,i) => {
        keys[i] = typeof v === 'string'
          ? v.trim() : '';
      });
    }
  } catch(e) {}

  if (!keys.some(Boolean)) {
    const old = localStorage.getItem('gemini_key');
    if (old) keys[0] = old.trim();
  }

  const savedIndex = Number(
    localStorage.getItem('selected_gemini_key') || 0
  );

  selected =
    Number.isInteger(savedIndex) &&
    savedIndex >= 0 &&
    savedIndex < 5
      ? savedIndex : 0;

  if (!keys[selected]) {
    const first = keys.findIndex(Boolean);
    if (first >= 0) selected = first;
  }

  render();
  startCamera();

  if (!keys.some(Boolean)) {
    show(
      'مرحباً بك في لقطة AI',
      'اضغط 🔑 وأضف مفتاح Gemini للبدء.'
    );
  }
}

function show(status,text) {
  result.style.display = 'block';
  statusEl.textContent = status;
  answerEl.textContent = text || '';
}

function stopRequest() {
  requestId++;

  if (controller) {
    controller.abort();
    controller = null;
  }
}

function render() {
  $('auto').classList.toggle('active',mode === 'auto');
  $('manual').classList.toggle('active',mode === 'manual');

  $('numbers').classList.toggle(
    'visible',
    mode === 'manual'
  );

  document.querySelectorAll('.number').forEach(b => {
    const n = Number(b.dataset.n);

    b.disabled = !keys[n];

    b.classList.toggle(
      'active',
      n === selected && !!keys[n]
    );
  });
}

function setMode(value) {
  if (mode === value) return;

  stopRequest();
  mode = value;

  localStorage.setItem('gemini_mode',mode);
  render();

  if (captured) {
    show(
      'تم تغيير الوضع',
      'التقط سؤالاً جديداً للمتابعة.'
    );
  }
}

function chooseKey(n) {
  if (!keys[n]) return;

  stopRequest();
  selected = n;

  localStorage.setItem(
    'selected_gemini_key',
    String(n)
  );

  render();

  if (captured) {
    show(
      'المفتاح رقم '+(n+1)+' محدد',
      'التقط سؤالاً جديداً للمتابعة.'
    );
  }
}

function openSettings() {
  const inputs = $('inputs');
  inputs.replaceChildren();

  for (let i=0;i<5;i++) {
    const wrap = document.createElement('div');
    wrap.className = 'field';

    const label = document.createElement('label');
    label.textContent = 'المفتاح رقم '+(i+1);
    label.htmlFor = 'key'+i;

    const input = document.createElement('input');
    input.id = 'key'+i;
    input.type = 'password';
    input.autocomplete = 'off';
    input.placeholder = 'AIza...';
    input.value = keys[i];

    wrap.append(label,input);
    inputs.append(wrap);
  }

  $('settingsOverlay').classList.add('open');
}

function closeSettings() {
  $('settingsOverlay').classList.remove('open');
}

function saveSettings() {
  stopRequest();

  keys = Array.from(
    {length:5},
    (_,i) => $('key'+i).value.trim()
  );

  localStorage.setItem(
    'gemini_keys',
    JSON.stringify(keys)
  );

  localStorage.removeItem('gemini_key');

  if (!keys[selected]) {
    const first = keys.findIndex(Boolean);
    selected = first < 0 ? 0 : first;
  }

  localStorage.setItem(
    'selected_gemini_key',
    String(selected)
  );

  closeSettings();
  render();

  show(
    'تم حفظ المفاتيح',
    keys.some(Boolean)
      ? 'وجّه الكاميرا للسؤال واضغط التقاط.'
      : 'أضف مفتاحاً واحداً على الأقل.'
  );
}

[
  'settingsOverlay',

/* الكاميرا الخلفية العادية قدر الإمكان */
async function startCamera() {
  let stream;

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        'افتح الموقع عبر HTTPS في متصفح يدعم الكاميرا'
      );
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:'environment'}
      }
    });

    try {
      const devices = (
        await navigator.mediaDevices.enumerateDevices()
      ).filter(d => d.kind === 'videoinput');

      const rear = devices.filter(d =>
        /back|rear|environment|خلف/i.test(d.label)
      );

      const ordinary =
        rear.find(d =>
          /^(back|rear) camera$/i.test(d.label.trim())
        ) ||
        rear.find(d =>
          /wide/i.test(d.label) &&
          !/ultra|dual|triple|tele|macro/i.test(d.label)
        ) ||
        rear.find(d =>
          !/ultra|tele|dual|triple|macro|0\.5|2x|3x|5x/i.test(d.label)
        );

      if (
        ordinary &&
        ordinary.deviceId &&
        stream.getVideoTracks()[0]?.getSettings().deviceId
          !== ordinary.deviceId
      ) {
        try {
          const preferred =
            await navigator.mediaDevices.getUserMedia({
              audio:false,
              video:{
                deviceId:{exact:ordinary.deviceId}
              }
            });

          stream.getTracks().forEach(t => t.stop());
          stream = preferred;
        } catch(e) {}
      }
    } catch(e) {}

    const track = stream.getVideoTracks()[0];

    try {
      const caps = track.getCapabilities?.();

      if (
        caps?.zoom &&
        typeof track.applyConstraints === 'function'
      ) {
        const target = Math.max(
          caps.zoom.min,
          Math.min(1,caps.zoom.max)
        );

        await track.applyConstraints({
          advanced:[{zoom:target}]
        });
      }
    } catch(e) {}

    video.srcObject = stream;
    await video.play();

    note.textContent = 'وجّه الكاميرا نحو السؤال';

  } catch(e) {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    note.textContent = 'الكاميرا لم تعمل';

    show(
      'تعذر تشغيل الكاميرا',
      e.name === 'NotAllowedError'
        ? 'اسمح للموقع باستخدام الكاميرا.'
        : e.message
    );
  }
}

/* التقاط السؤال */
function mainAction() {
  if (captured) {
    reset();
    return;
  }

  if (!video.videoWidth) {
    show(
      'الكاميرا غير جاهزة',
      'تحقق من إذن الكاميرا وحدّث الصفحة.'
    );
    return;
  }

  stopRequest();

  const canvas = document.createElement('canvas');

  const scale = Math.min(
    1,
    1280/Math.max(
      video.videoWidth,
      video.videoHeight
    )
  );

  canvas.width = Math.round(
    video.videoWidth*scale
  );

  canvas.height = Math.round(
    video.videoHeight*scale
  );

  canvas.getContext('2d').drawImage(
    video,0,0,canvas.width,canvas.height
  );

  const image = canvas.toDataURL('image/jpeg',.75);

  photo.src = image;
  photo.style.display = 'block';
  video.style.display = 'none';
  note.style.display = 'none';

  captured = true;

  captureBtn.classList.add('new');
  captureBtn.textContent = '🔄 التقاط سؤال جديد';

  analyze(image);
}

function reset() {
  stopRequest();
  captured = false;

  photo.style.display = 'none';
  photo.removeAttribute('src');

  video.style.display = 'block';
  note.style.display = 'block';
  note.textContent = 'وجّه الكاميرا نحو السؤال';

  captureBtn.classList.remove('new');
  captureBtn.textContent = '📸 التقاط وتحليل فوري';

  result.style.display = 'none';
}

/* Gemini */
function isKeyError(e) {
  return e.status === 401 || (
    e.status === 403 &&
    /api.key|invalid.key|key.not.valid|api_key/i.test(e.message) &&
    !/quota|rate.limit|safety/i.test(e.message)
  );
}

function errorText(e) {
  if (e.status === 429) {
    return 'وصلت إلى حد الطلبات أو انتهت حصة الاستخدام.';
  }

  if (e.status === 400 || e.status === 404) {
    return 'النموذج غير متاح أو الطلب غير مقبول. راجع اسم نموذج Gemini.';
  }

  if (e.status === 401 || e.status === 403) {
    return 'مفتاح API غير صالح أو ليس لديه الصلاحية.';
  }

  if ([500,502,503,504].includes(e.status)) {
    return 'خدمة Gemini مشغولة مؤقتاً.';
  }

  if (e instanceof TypeError) {
    return 'تعذر الاتصال. تحقق من الإنترنت.';
  }

  return e.message || 'حدث خطأ غير معروف.';
}

async function ask(key,image,signal) {
  const url =
    'https://generativelanguage.googleapis.com/v1beta/models/' +
    encodeURIComponent(MODEL) +
    ':generateContent?key=' +
    encodeURIComponent(key);

  const response = await fetch(url,{
    method:'POST',
    signal,
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      contents:[{
        parts:[
          {
            text:
              'اقرأ السؤال والخيارات في الصورة. ' +
              'أعط حرف الخيار الصحيح ونص الإجابة فقط دون شرح. ' +
              'إذا لم تستطع قراءة السؤال فقل إن الصورة غير واضحة ولا تخمّن.'
          },
          {
            inline_data:{
              mime_type:'image/jpeg',
              data:image.split(',')[1]
            }
          }
        ]
      }],
      generationConfig:{
        temperature:0,
        maxOutputTokens:256
      }
    })
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const e = new Error(
      data.error?.message || 'HTTP '+response.status
    );

    e.status = response.status;
    throw e;
  }

  const candidate = data.candidates?.[0];

  const text = candidate?.content?.parts
    ?.filter(x => typeof x.text === 'string')
    .map(x => x.text)
    .join('\n');

  if (!text?.trim()) {
    throw new Error(
      'لم تصل إجابة نصية. حاول بصورة أوضح.'
    );
  }

  return text.replace(/\*\*/g,'').trim();
}

async function analyze(image) {
  if (!keys.some(Boolean)) {
    show(
      'لا يوجد مفتاح',
      'اضغط 🔑 وأضف مفتاح Gemini.'
    );
    return;
  }

  if (!keys[selected]) {
    show(
      'اختر مفتاحاً',
      'اختر مفتاحاً محفوظاً.'
    );
    return;
  }

  stopRequest();

  const id = requestId;
  controller = new AbortController();
  const signal = controller.signal;

  const order = mode === 'manual'
    ? [selected]
    : [
        selected,
        ...keys.map((_,i) => i).filter(
          i => i !== selected && keys[i]
        )
      ];

  try {
    for (const index of order) {
      show(
        'جاري التحليل بالمفتاح '+(index+1)+'...',
        ''
      );

      let last;

      for (let attempt=0;attempt<2;attempt++) {
        try {
          const text = await ask(
            keys[index],
            image,
            signal
          );

          if (id !== requestId) return;

          selected = index;

          localStorage.setItem(
            'selected_gemini_key',
            String(index)
          );

          render();

          show(
            'تم التحليل — المفتاح '+(index+1),
            text
          );

          try {
            await saveHistory(image,text);

            if (id === requestId) {
              statusEl.textContent =
                'تم التحليل والحفظ في السجل — المفتاح ' +
                (index+1);
            }
          } catch(e) {
            if (id === requestId) {
              statusEl.textContent =
                'تم التحليل — تعذر حفظ السجل';
            }

            console.error(e);
          }

          return;

        } catch(e) {
          if (id !== requestId || signal.aborted) {
            return;
          }

          last = e;

          if (
            (
              e instanceof TypeError ||
              [500,502,503,504].includes(e.status)
            ) &&
            attempt === 0
          ) {
            await new Promise((resolve,reject) => {
              const timer = setTimeout(resolve,1000);

              signal.addEventListener(
                'abort',
                () => {
                  clearTimeout(timer);
                  reject(
                    new DOMException('Aborted','AbortError')
                  );
                },
                {once:true}
              );
            });

            continue;
          }

          break;
        }
      }

      if (mode === 'auto' && isKeyError(last)) {
        continue;
      }

      throw last;
    }

    throw new Error(
      'لم يتوفر مفتاح صالح للاستخدام.'
    );

  } catch(e) {
    if (
      id !== requestId ||
      e.name === 'AbortError'
    ) return;

    show(
      'تعذر تحليل السؤال',
      errorText(e)
    );

  } finally {
    if (id === requestId) {
      controller = null;
    }
  }
}
