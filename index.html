
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c14">
<title>المجيب السريع</title>
<style>
:root {
  color-scheme: dark;
  --bg:#080c14;
  --panel:#101827;
  --line:#273449;
  --blue:#2563eb;
  --green:#059669;
  --text:#f8fafc;
  --muted:#94a3b8;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}
button,input { font:inherit; }
button { cursor:pointer; }
button:disabled { opacity:.35;cursor:not-allowed; }
header {
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(8,12,20,.98);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 9px) 10px 9px;
}
.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
.brand {
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
}
.tools { display:flex;align-items:center;gap:5px; }
.small {
  border:1px solid var(--line);
  background:#1e293b;
  color:white;
  border-radius:9px;
  padding:9px;
}
.modebar {
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:9px;
}
.mode {
  flex:1;
  border:1px solid var(--line);
  border-radius:10px;
  background:#172033;
  color:#cbd5e1;
  padding:10px;
  font-weight:750;
}
.mode.active {
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}
.keyrow {
  display:none;
  gap:6px;
  align-items:center;
  margin-top:9px;
}
.keyrow.show { display:flex; }
.keyrow span { color:var(--muted);font-size:12px; }
.keynum {
  flex:1;
  padding:9px 0;
  border:1px solid var(--line);
  border-radius:9px;
  background:#172033;
  color:white;
  font-weight:bold;
}
.keynum.active {
  background:var(--blue);
  border-color:var(--blue);
}
main { padding:10px 10px 28px; }
.camera {
  position:relative;
  width:100%;
  height:62dvh;
  min-height:300px;
  background:#020617;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
video,#photo {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
#photo { display:none; }
.cameraHint {
  position:absolute;
  inset:auto 12px 12px;
  background:#020617aa;
  border-radius:10px;
  padding:8px;
  text-align:center;
  font-size:12px;
  color:#cbd5e1;
  pointer-events:none;
}
#captureBtn {
  display:block;
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:13px;
  background:var(--blue);
  color:white;
  padding:17px 12px;
  font-size:18px;
  font-weight:800;
}
#captureBtn.new { background:var(--green); }
.status {
  margin:12px 0 0;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}
.answer {
  margin-top:12px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:15px;
  padding:18px 12px;
  min-height:85px;
  text-align:center;
  font-size:26px;
  line-height:1.6;
  font-weight:800;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.overlay {
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000b;
  padding:16px;
}
.overlay.show { display:flex; }
.modal {
  width:min(100%,420px);
  max-height:85dvh;
  overflow:auto;
  background:#111b2b;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
}
.modal h2 { margin:0 0 12px;font-size:20px; }
.modal p { color:var(--muted);font-size:13px; }
.field { margin:12px 0; }
.field label {
  display:block;
  margin-bottom:5px;
  color:#cbd5e1;
  font-size:13px;
}
.field input {
  width:100%;
  background:#080c14;
  color:white;
  border:1px solid #334155;
  border-radius:10px;
  padding:12px;
  direction:ltr;
}
.actions { display:flex;gap:8px;margin-top:16px; }
.actions button {
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#334155;
  color:white;
  font-weight:bold;
}
.actions .save { background:var(--blue); }
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">📷 المجيب السريع</div>
    <div class="tools">
      <button class="small" onclick="openSettings()" aria-label="المفاتيح">🔑</button>
      <button class="small" onclick="openSettings()" aria-label="الإعدادات">⚙️</button>
    </div>
  </div>

  <div class="modebar">
    <button id="autoBtn" class="mode" onclick="setMode('auto')">⚡ أوتو</button>
    <button id="manualBtn" class="mode" onclick="setMode('manual')">✋ يدوي</button>
  </div>

  <div id="keyRow" class="keyrow">
    <span>المفتاح</span>
    <button class="keynum" data-key="0" onclick="selectKey(0)">1</button>
    <button class="keynum" data-key="1" onclick="selectKey(1)">2</button>
    <button class="keynum" data-key="2" onclick="selectKey(2)">3</button>
    <button class="keynum" data-key="3" onclick="selectKey(3)">4</button>
    <button class="keynum" data-key="4" onclick="selectKey(4)">5</button>
  </div>
</header>

<main>
  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="السؤال الملتقط">
    <div id="cameraHint" class="cameraHint">وجّه الكاميرا نحو السؤال</div>
  </div>

  <button id="captureBtn" onclick="mainAction()">📸 التقاط وتحليل فوري</button>
  <div id="status" class="status">جاري تشغيل الكاميرا...</div>
  <div id="answer" class="answer">الإجابة تظهر هنا</div>
</main>

<div id="settingsOverlay" class="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">🔑 إعدادات مفاتيح Gemini</h2>
    <p>أضف حتى 5 مفاتيح. تظهر أرقام المفاتيح المحفوظة في الوضع اليدوي.</p>
    <div id="keyInputs"></div>
    <div class="actions">
      <button onclick="closeSettings()">إلغاء</button>
      <button class="save" onclick="saveSettings()">حفظ المفاتيح</button>
    </div>
  </div>
</div>

<script>
'use strict';

// حافظنا على اسم النموذج الذي تستخدمه.
// إذا لم يكن متاحاً لحسابك سيظهر خطأ النموذج.
const MODEL = 'gemini-3.8-flash';

const $ = id => document.getElementById(id);
const video = $('video');
const photo = $('photo');
const answer = $('answer');
const statusBox = $('status');
const captureBtn = $('captureBtn');

let keys = [];
let selectedKey = 0;
let mode = localStorage.getItem('gemini_mode') === 'manual'
  ? 'manual' : 'auto';

let captured = false;
let imageBase64 = '';
let controller = null;
let requestNumber = 0;

function loadKeys() {
  try {
    const stored = JSON.parse(localStorage.getItem('gemini_keys') || '[]');
    if (Array.isArray(stored)) {
      keys = stored.slice(0,5).map(v => typeof v === 'string' ? v.trim() : '');
    }
  } catch (_) {
    keys = [];
  }

  // دعم المفتاح القديم
  if (!keys.some(Boolean)) {
    const old = localStorage.getItem('gemini_key');
    if (old) keys = [old.trim()];
  }

  while (keys.length < 5) keys.push('');

  const saved = Number(localStorage.getItem('selected_gemini_key'));
  selectedKey = Number.isInteger(saved) && saved >= 0 && saved < 5
    ? saved : 0;

  if (!keys[selectedKey]) {
    const first = keys.findIndex(Boolean);
    if (first >= 0) selectedKey = first;
  }
}

function saveSelected() {
  localStorage.setItem('selected_gemini_key', String(selectedKey));
}

function updateUI() {
  $('autoBtn').classList.toggle('active', mode === 'auto');
  $('manualBtn').classList.toggle('active', mode === 'manual');
  $('keyRow').classList.toggle('show', mode === 'manual');

  document.querySelectorAll('.keynum').forEach(btn => {
    const index = Number(btn.dataset.key);
    btn.disabled = !keys[index];
    btn.classList.toggle('active', index === selectedKey && !!keys[index]);
    btn.title = keys[index] ? 'استخدام المفتاح ' + (index+1) : 'لم يتم حفظ هذا المفتاح';
  });
}

function cancelRequest() {
  requestNumber++;
  if (controller) {
    controller.abort();
    controller = null;
  }
}

function setMode(nextMode) {
  if (mode === nextMode) return;
  cancelRequest();
  mode = nextMode;
  localStorage.setItem('gemini_mode',mode);
  updateUI();
  statusBox.textContent = mode === 'auto'
    ? 'الوضع التلقائي مفعّل'
    : 'الوضع اليدوي مفعّل — اختر رقم المفتاح';
}

function selectKey(index) {
  if (!keys[index]) return;
  cancelRequest();
  selectedKey = index;
  saveSelected();
  updateUI();
  statusBox.textContent = 'تم اختيار المفتاح رقم ' + (index+1);
}

function openSettings() {
  const wrap = $('keyInputs');
  wrap.innerHTML = '';

  for (let i=0; i<5; i++) {
    const field = document.createElement('div');
    field.className = 'field';

    const label = document.createElement('label');
    label.textContent = 'المفتاح رقم ' + (i+1);
    label.htmlFor = 'apiKey' + i;

    const input = document.createElement('input');
    input.type = 'password';
    input.id = 'apiKey' + i;
    input.autocomplete = 'off';
    input.placeholder = 'AIza...';
    input.value = keys[i] || '';

    field.append(label,input);
    wrap.append(field);
  }

  $('settingsOverlay').classList.add('show');
}

function closeSettings() {
  $('settingsOverlay').classList.remove('show');
}

function saveSettings() {
  const next = [];
  for (let i=0;i<5;i++) {
    next.push($('apiKey'+i).value.trim());
  }

  keys = next;
  localStorage.setItem('gemini_keys',JSON.stringify(keys));

  if (!keys[selectedKey]) {
    const first = keys.findIndex(Boolean);
    selectedKey = first >= 0 ? first : 0;
  }

  saveSelected();
  cancelRequest();
  updateUI();
  closeSettings();
  statusBox.textContent = 'تم حفظ إعدادات المفاتيح';
}

$('settingsOverlay').addEventListener('click',event => {
  if (event.target === $('settingsOverlay')) closeSettings();
});

async function startCamera() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('الكاميرا تحتاج اتصال HTTPS ومتصفحاً يدعم التصوير');
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1920},
        height:{ideal:1080}
      }
    });

    video.srcObject = stream;
    await video.play();

    statusBox.textContent = keys.some(Boolean)
      ? 'الكاميرا جاهزة'
      : 'الكاميرا جاهزة — أضف مفتاح Gemini من 🔑';
  } catch (error) {
    statusBox.textContent = 'تعذر تشغيل الكاميرا: ' + error.message;
  }
}

function mainAction() {
  if (captured) {
    resetCamera();
  } else {
    capture();
  }
}

function capture() {
  if (!video.videoWidth || !video.videoHeight) {
    statusBox.textContent = 'انتظر حتى تعمل الكاميرا';
    return;
  }

  cancelRequest();

  const canvas = document.createElement('canvas');
  const scale = Math.min(
    1,
    1280 / Math.max(video.videoWidth,video.videoHeight)
  );

  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);

  const ctx = canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg',0.75);
  imageBase64 = dataUrl.split(',')[1];

  photo.src = dataUrl;
  photo.style.display = 'block';
  video.style.display = 'none';
  $('cameraHint').style.display = 'none';

  captured = true;
  captureBtn.classList.add('new');
  captureBtn.textContent = '🔄 التقاط سؤال جديد';

  answer.textContent = 'جاري تحليل السؤال...';
  statusBox.textContent = 'جاري إرسال الصورة إلى Gemini';

  analyze(imageBase64);
}

function resetCamera() {
  cancelRequest();
  captured = false;
  imageBase64 = '';

  photo.style.display = 'none';
  photo.removeAttribute('src');
  video.style.display = 'block';
  $('cameraHint').style.display = '';

  captureBtn.classList.remove('new');
  captureBtn.textContent = '📸 التقاط وتحليل فوري';

  answer.textContent = 'الإجابة تظهر هنا';
  statusBox.textContent = 'وجّه الكاميرا نحو السؤال الجديد';
}

function cleanAnswer(text) {
  return String(text || '')
    .replace(/\*\*/g,'')
    .trim();
}

function readableWait(message) {
  const match = String(message).match(
    /retry\s+(?:in|after)\s+([^\n.]+)/i
  );
  return match ? ' — ' + match[1].trim() : '';
}

function errorMessage(error) {
  if (error.name === 'AbortError') return 'تم إلغاء الطلب';

  const code = error.status;
  const message = String(error.message || '');

  if (code === 429) {
    return 'انتهى الحد المتاح حالياً للمشروع أو الحساب' +
      readableWait(message) +
      '. انتظر إعادة توفر الحصة أو راجع الفوترة.';
  }
  if (code === 401 || code === 403) {
    return 'المفتاح غير مصرح له باستخدام الخدمة أو لا يملك الصلاحية المطلوبة.';
  }
  if (code === 400 || code === 404) {
    return 'تحقق من اسم النموذج وإعدادات Gemini API. ' + message;
  }
  if ([500,502,503,504].includes(code)) {
    return 'خدمة Gemini مشغولة أو متوقفة مؤقتاً. حاول بعد قليل.';
  }
  if (error instanceof TypeError) {
    return 'تعذر الاتصال بالخدمة. تحقق من الإنترنت.';
  }
  return message || 'حدث خطأ غير معروف';
}

function isKeySpecificError(error) {
  const message = String(error.message || '').toLowerCase();

  if (error.status === 401) return true;

  return error.status === 403 &&
    /api.key|invalid.key|key.not.valid|permission.denied|api_key/.test(message) &&
    !/quota|rate.limit|safety|policy/.test(message);
}

function temporaryError(error) {
  return [500,502,503,504].includes(error.status) ||
    error instanceof TypeError;
}

function wait(ms,signal) {
  return new Promise((resolve,reject) => {
    if (signal.aborted) {
      reject(new DOMException('Aborted','AbortError'));
      return;
    }
    const timer = setTimeout(() => {
      signal.removeEventListener('abort',onAbort);
      resolve();
    },ms);
    function onAbort() {
      clearTimeout(timer);
      reject(new DOMException('Aborted','AbortError'));
    }
    signal.addEventListener('abort',onAbort,{once:true});
  });
}

async function requestAnswer(apiKey,image,signal) {
  const prompt =
    'اقرأ السؤال الظاهر في الصورة وحدد الإجابة الصحيحة. ' +
    'إذا كان سؤال اختيار من متعدد، اكتب حرف الخيار ونص الإجابة فقط، ' +
    'بالعربية وباختصار شديد. ' +
    'إذا كانت الصورة غير واضحة فاطلب إعادة التصوير. ' +
    'لا تخمّن إذا لم تستطع قراءة السؤال.';

  const response = await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/' +
    encodeURIComponent(MODEL) +
    ':generateContent?key=' + encodeURIComponent(apiKey),
    {
      method:'POST',
      signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{
          parts:[
            {text:prompt},
            {inline_data:{mime_type:'image/jpeg',data:image}}
          ]
        }],
        generationConfig:{
          temperature:0,
          maxOutputTokens:256
        }
      })
    }
  );

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const error = new Error(
      data.error?.message || 'HTTP ' + response.status
    );
    error.status = response.status;
    throw error;
  }

  const candidate = data.candidates?.[0];
  const text = candidate?.content?.parts
    ?.filter(part => typeof part.text === 'string')
    .map(part => part.text)
    .join('\n');

  if (!text?.trim()) {
    if (
      candidate?.finishReason === 'SAFETY' ||
      data.promptFeedback?.blockReason
    ) {
      throw new Error('تعذر تقديم إجابة لهذا السؤال.');
    }
    throw new Error('لم تصل إجابة نصية. حاول تصوير السؤال بشكل أوضح.');
  }

  return cleanAnswer(text);
}

async function analyze(image) {
  if (!keys.some(Boolean)) {
    answer.textContent = 'أضف مفتاح Gemini أولاً من زر 🔑';
    statusBox.textContent = 'لا توجد مفاتيح محفوظة';
    return;
  }

  if (!keys[selectedKey]) {
    answer.textContent = 'اختر مفتاحاً محفوظاً من الشريط العلوي';
    return;
  }

  cancelRequest();
  const currentRequest = requestNumber;
  controller = new AbortController();
  const signal = controller.signal;

  const indices = mode === 'manual'
    ? [selectedKey]
    : [
        selectedKey,
        ...keys.map((_,i) => i).filter(i =>
          i !== selectedKey && !!keys[i]
        )
      ];

  for (const index of indices) {
    if (!keys[index]) continue;

    let lastError = null;

    for (let attempt=0;attempt<2;attempt++) {
      try {
        statusBox.textContent =
          'جاري التحليل بالمفتاح رقم ' + (index+1);

        const result = await requestAnswer(keys[index],image,signal);

        if (currentRequest !== requestNumber) return;

        selectedKey = index;
        saveSelected();
        updateUI();

        answer.textContent = result;
        statusBox.textContent =
          'اكتمل التحليل — المفتاح رقم ' + (index+1);
        controller = null;
        return;
      } catch (error) {
        if (currentRequest !== requestNumber || signal.aborted) return;

        lastError = error;

        if (temporaryError(error) && attempt === 0) {
          statusBox.textContent = 'مشكلة مؤقتة، جاري إعادة المحاولة...';
          try {
            await wait(1200,signal);
          } catch (_) {
            return;
          }
          continue;
        }

        break;
      }
    }

    if (currentRequest !== requestNumber) return;

    // في الوضع التلقائي ننتقل لمفتاح آخر
    // فقط عند وجود مشكلة خاصة بصلاحية المفتاح.
    // لا نتجاوز حدود الحصة 429 بتبديل المفاتيح.
    if (mode === 'auto' && isKeySpecificError(lastError)) {
      statusBox.textContent =
        'المفتاح ' + (index+1) + ' غير صالح، تجربة التالي...';
      continue;
    }

    answer.textContent = errorMessage(lastError);
    statusBox.textContent = 'تعذر إكمال التحليل';
    controller = null;
    return;
  }

  if (currentRequest === requestNumber) {
    answer.textContent = 'لا يوجد مفتاح صالح متاح حالياً';
    statusBox.textContent = 'راجع إعدادات المفاتيح';
    controller = null;
  }
}

loadKeys();
updateUI();
startCamera();
</script>
</body>
</html>
